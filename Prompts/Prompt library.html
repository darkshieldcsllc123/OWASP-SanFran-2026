<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Prompt library</title>
<style>
:root{
  color-scheme:light;
  --bg:#E7EBEF;
  --panel:#FFFFFF;
  --panel-2:#F3F5F8;
  --sunk:#DCE2E8;
  --ink:#16202A;
  --muted:#55606E;
  --faint:#7F8A98;
  --line:#D2D8DF;
  --line-strong:#ABB5C1;
  --accent:#16202A;
  --accent-ink:#FFFFFF;
  --hl:#FFE36E;
  --hl-ink:#1D1A0E;
  --pin:#D39314;
  --danger:#B83A27;
  --ok:#2C7A55;
  --focus:#2F6BEA;
  --overlay:rgba(22,32,42,.42);
  --shadow:0 24px 60px -20px rgba(22,32,42,.45);
  --fs:15px;
  --r-sm:7px;
  --r:10px;
  --r-lg:16px;
  --gap:14px;
  --card-pad:14px 16px 12px 20px;
  --lines:4;
  --ui:"Avenir Next","Segoe UI Variable Text","Segoe UI",system-ui,-apple-system,"Helvetica Neue",Roboto,Arial,sans-serif;
  --mono:ui-monospace,"SF Mono","Cascadia Code","JetBrains Mono",Menlo,Consolas,"Liberation Mono",monospace;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    color-scheme:dark;
    --bg:#151B22;--panel:#1E252E;--panel-2:#192028;--sunk:#29313C;
    --ink:#E6EBF1;--muted:#A2ADBA;--faint:#7D8896;--line:#303945;--line-strong:#465261;
    --accent:#E6EBF1;--accent-ink:#151B22;--hl:#E9C94A;--hl-ink:#17150A;--pin:#F0C04A;
    --danger:#F08A73;--ok:#74C9A1;--focus:#7FA6FF;--overlay:rgba(6,9,13,.62);--shadow:0 24px 60px -20px rgba(0,0,0,.75);
  }
}
:root[data-theme="dark"]{
  color-scheme:dark;
  --bg:#151B22;--panel:#1E252E;--panel-2:#192028;--sunk:#29313C;
  --ink:#E6EBF1;--muted:#A2ADBA;--faint:#7D8896;--line:#303945;--line-strong:#465261;
  --accent:#E6EBF1;--accent-ink:#151B22;--hl:#E9C94A;--hl-ink:#17150A;--pin:#F0C04A;
  --danger:#F08A73;--ok:#74C9A1;--focus:#7FA6FF;--overlay:rgba(6,9,13,.62);--shadow:0 24px 60px -20px rgba(0,0,0,.75);
}
:root[data-density="compact"]{--gap:9px;--card-pad:10px 12px 9px 16px}

*,*::before,*::after{box-sizing:border-box}
html{height:100%;background:var(--bg);scroll-padding-top:env(safe-area-inset-top,0px);-webkit-text-size-adjust:100%;text-size-adjust:100%}
body{height:100%;margin:0;background:var(--bg);color:var(--ink);font-family:var(--ui);font-size:var(--fs);line-height:1.5;-webkit-font-smoothing:antialiased;overflow:hidden}
button,input,select,textarea{font:inherit;color:inherit;letter-spacing:inherit}
button{cursor:pointer;-webkit-tap-highlight-color:transparent}
button:disabled,select:disabled{cursor:not-allowed;opacity:.45}
:focus-visible{outline:2px solid var(--focus);outline-offset:2px}
h1,h2,h3,p{margin:0}
.sr-only{position:absolute!important;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0}
.grow{flex:1 1 auto}
.muted{color:var(--muted)}
.ic{width:18px;height:18px;flex:none;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
kbd{font-family:var(--mono);font-size:.74em;line-height:1;padding:3px 6px;border:1px solid var(--line);border-bottom-width:2px;border-radius:5px;background:var(--panel);color:var(--muted);white-space:nowrap}
code{font-family:var(--mono);font-size:.88em;background:var(--sunk);padding:1px 5px;border-radius:4px}
mark{background:color-mix(in srgb,var(--focus) 22%,transparent);color:inherit;border-radius:3px;padding:0 1px}

/* The highlighter: fill-in fields are marked like a pen swipe */
.var{font-family:var(--mono);font-size:.94em;color:var(--hl-ink);background:linear-gradient(100deg,transparent 0 .1em,var(--hl) .26em calc(100% - .26em),transparent calc(100% - .1em));padding:.04em .36em;margin:0 -.04em;border-radius:.32em .18em .36em .14em;-webkit-box-decoration-break:clone;box-decoration-break:clone}
.filled{background:linear-gradient(transparent 60%,var(--hl) 60%);-webkit-box-decoration-break:clone;box-decoration-break:clone}
.filled.is-default{background:linear-gradient(transparent 60%,var(--sunk) 60%)}

/* Controls */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:7px;height:38px;padding:0 14px;border-radius:var(--r);border:1px solid var(--line);background:var(--panel);color:var(--ink);font-weight:600;font-size:.92em;white-space:nowrap;transition:background-color .12s,border-color .12s,color .12s}
.btn:hover:not(:disabled){border-color:var(--line-strong)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.primary:hover:not(:disabled){filter:brightness(1.12);border-color:var(--accent)}
.btn.ghost{background:transparent;border-color:transparent}
.btn.ghost:hover:not(:disabled){background:var(--sunk);border-color:transparent}
.btn.danger{color:var(--danger)}
.btn.danger-solid{background:var(--danger);border-color:var(--danger);color:#fff}
.btn.sm{height:30px;padding:0 10px;font-size:.84em;border-radius:8px;gap:6px}
.btn.sm .ic{width:16px;height:16px}
.btn.copied{background:var(--ok);border-color:var(--ok);color:#fff}
.icon-btn{width:38px;height:38px;display:inline-grid;place-items:center;border-radius:var(--r);border:1px solid transparent;background:none;color:var(--muted);flex:none;padding:0}
.icon-btn:hover:not(:disabled){background:var(--sunk);color:var(--ink)}
.icon-btn[aria-pressed="true"]{background:var(--panel);border-color:var(--line);color:var(--ink)}
.icon-btn.sm{width:30px;height:30px;border-radius:8px}
.icon-btn.sm .ic{width:16px;height:16px}
.pin.on,.pin.on[aria-pressed="true"]{color:var(--pin);background:none;border-color:transparent}
.pin.on:hover{background:var(--sunk)}
.pin.on .ic{fill:var(--pin);stroke:var(--pin)}
.link{border:0;background:none;padding:0;color:var(--muted);text-decoration:underline;text-decoration-color:var(--line-strong);text-underline-offset:3px;font-size:.88em;font-weight:500}
.link:hover{color:var(--ink);text-decoration-color:currentColor}
.seg{display:inline-flex;padding:3px;background:var(--sunk);border-radius:var(--r);gap:2px;flex:none}
.seg > button{height:30px;border:0;background:none;padding:0 11px;border-radius:7px;color:var(--muted);font-weight:600;font-size:.88em;display:inline-flex;align-items:center;gap:6px}
.seg > button.icon-only{width:34px;padding:0;justify-content:center}
.seg > button:hover{color:var(--ink)}
.seg > button[aria-pressed="true"],.seg > button[aria-selected="true"]{background:var(--panel);color:var(--ink);box-shadow:0 0 0 1px var(--line)}
.select-wrap{position:relative;display:inline-flex;flex:none}
.select-wrap .ic{position:absolute;right:9px;top:50%;transform:translateY(-50%);pointer-events:none;color:var(--muted);width:16px;height:16px}
select.control{appearance:none;-webkit-appearance:none;height:38px;border:1px solid var(--line);background:var(--panel);border-radius:var(--r);padding:0 32px 0 12px;font-size:.92em;font-weight:500;cursor:pointer;max-width:100%}
select.control.sm{height:30px;font-size:.84em;border-radius:8px;padding-left:10px}
select.control.full{width:100%}
.select-wrap.full{display:flex;width:100%}
input[type="text"],input[type="search"],textarea{width:100%;border:1px solid var(--line);background:var(--panel);border-radius:8px;padding:9px 11px;line-height:1.45;font-size:.95em}
input[type="text"]:focus,input[type="search"]:focus,textarea:focus,select.control:focus{outline:none;border-color:var(--focus);box-shadow:0 0 0 3px color-mix(in srgb,var(--focus) 24%,transparent)}
textarea{resize:vertical}
::placeholder{color:var(--faint);opacity:1}
input[list]::-webkit-calendar-picker-indicator{display:none!important;opacity:0}

/* Layout */
.app{height:100%;display:grid;grid-template-columns:262px minmax(0,1fr)}
.sidebar{background:var(--panel-2);border-right:1px solid var(--line);overflow-y:auto;padding:18px 12px 14px;display:flex;flex-direction:column;gap:22px;min-height:0}
.main{display:flex;flex-direction:column;min-width:0;min-height:0}
.toolbar{flex:none;display:flex;align-items:center;gap:8px;padding:12px 22px;border-bottom:1px solid var(--line);background:var(--bg);flex-wrap:wrap}
.menu-btn{display:none}
.search{position:relative;flex:1 1 240px;min-width:170px;max-width:540px}
.search > .ic{position:absolute;left:11px;top:50%;transform:translateY(-50%);color:var(--faint);pointer-events:none}
.search input{height:38px;padding:0 44px 0 36px;border-radius:var(--r)}
.search kbd{position:absolute;right:10px;top:50%;transform:translateY(-50%);pointer-events:none}
.search input:focus ~ kbd,.search input:not(:placeholder-shown) ~ kbd{display:none}
.tb-group{display:flex;align-items:center;gap:4px;flex:none}
.toolbar .spacer{flex:1 1 0;min-width:0}
.content{flex:1;min-height:0;overflow-y:auto;padding:14px 22px 56px;overscroll-behavior:contain}

/* Sidebar */
.brand{display:flex;align-items:center;gap:10px;padding:2px 8px}
.brand-mark{width:28px;height:28px;flex:none;color:var(--ink)}
.brand h1{font-size:1.08em;font-weight:700;letter-spacing:-.012em;flex:1}
.close-side{display:none}
.nav{display:flex;flex-direction:column;gap:1px}
.nav-item{display:flex;align-items:center;gap:10px;width:100%;min-height:34px;padding:6px 10px;border:0;background:none;border-radius:var(--r-sm);text-align:left;color:var(--ink);font-size:.93em;position:relative}
.nav-item:hover{background:var(--sunk)}
.nav-item[aria-current="true"]{background:var(--panel);box-shadow:0 0 0 1px var(--line);font-weight:650}
.nav-label{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.nav-item .count{margin-left:auto;color:var(--faint);font-size:.84em;font-variant-numeric:tabular-nums;font-weight:500}
.nav-item .dot{width:10px;height:10px;border-radius:3px;background:var(--c,var(--line-strong));flex:none}
.nav-item.drop-target{background:var(--panel);box-shadow:0 0 0 2px var(--accent)}
.side-head{display:flex;align-items:center;gap:2px;padding:0 2px 6px 10px}
.side-head h2{font-size:.82em;font-weight:650;color:var(--muted);flex:1}
.side-empty{font-size:.84em;color:var(--muted);padding:2px 10px;line-height:1.5}
.add-cat{padding:4px 4px 2px}
.add-cat input{height:34px;padding:0 10px}
.tag-cloud{display:flex;flex-wrap:wrap;gap:5px;padding:0 6px}
.more-tags{margin:8px 10px 0}
.side-foot{margin-top:auto;padding:12px 8px 0;border-top:1px solid var(--line);display:flex;flex-direction:column;gap:8px}
.stats{font-size:.82em;color:var(--muted)}
.sync{display:flex;align-items:flex-start;gap:8px;font-size:.8em;color:var(--muted);line-height:1.4}
.sync-dot{width:8px;height:8px;border-radius:50%;background:var(--faint);flex:none;margin-top:.35em}
.sync[data-state="synced"] .sync-dot{background:var(--ok)}
.sync[data-state="pending"] .sync-dot,.sync[data-state="saving"] .sync-dot,.sync[data-state="connecting"] .sync-dot{background:var(--pin)}
.sync[data-state="error"] .sync-dot,.sync[data-state="offline"] .sync-dot,.sync[data-state="blocked"] .sync-dot{background:var(--danger)}
.side-actions{display:flex;gap:2px;margin:0 -6px}

/* Tags */
.tag{display:inline-flex;align-items:center;gap:5px;height:24px;padding:0 8px;border-radius:999px;border:1px solid var(--line);background:transparent;color:var(--muted);font-size:.79em;line-height:1;white-space:nowrap}
button.tag:hover{color:var(--ink);border-color:var(--line-strong)}
.tag.on{background:var(--ink);border-color:var(--ink);color:var(--bg)}
.tag-n{color:var(--faint);font-variant-numeric:tabular-nums}
.tag.on .tag-n{color:inherit;opacity:.7}
.tag.static{cursor:default}
.chip{display:inline-flex;align-items:center;gap:2px;height:26px;padding:0 3px 0 10px;border-radius:999px;background:var(--panel);border:1px solid var(--line);font-size:.86em;color:var(--ink);max-width:100%}
.chip > span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.chip-x{width:20px;height:20px;border:0;background:none;border-radius:50%;display:grid;place-items:center;color:var(--muted);padding:0;flex:none}
.chip-x:hover{background:var(--sunk);color:var(--ink)}
.chip-x .ic{width:13px;height:13px;stroke-width:2.2}

/* Filter bar and bulk bar */
.filterbar{display:flex;align-items:center;gap:8px;flex-wrap:wrap;min-height:28px;margin-bottom:12px;font-size:.9em;color:var(--muted)}
.result-count{font-weight:600;color:var(--ink);margin-right:4px}
.filterbar .hint{margin-left:auto;font-size:.92em;color:var(--faint)}
.bulkbar{position:sticky;top:0;z-index:5;display:flex;flex-wrap:wrap;gap:6px;align-items:center;padding:8px 10px;margin:0 0 12px;background:var(--panel);border:1px solid var(--accent);border-radius:var(--r)}
.bulkbar[hidden]{display:none}
.bulk-count{font-size:.9em;margin:0 6px 0 4px}

/* Cards */
.cards.as-cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(272px,1fr));gap:var(--gap);align-items:stretch}
.cards.as-list{display:flex;flex-direction:column;gap:6px}
.card{position:relative;background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:var(--card-pad);display:flex;flex-direction:column;gap:8px;cursor:pointer;min-width:0;transition:border-color .12s}
.card::before{content:"";position:absolute;left:-1px;top:12px;bottom:12px;width:5px;border-radius:0 4px 4px 0;background:var(--cat)}
.card:hover{border-color:var(--line-strong)}
.card:focus-visible{outline:2px solid var(--focus);outline-offset:2px}
.card.is-selected{border-color:var(--accent);box-shadow:inset 0 0 0 1px var(--accent)}
.card.dragging{opacity:.4}
.card.drop-target{outline:2px dashed var(--accent);outline-offset:3px}
.card-head{display:flex;align-items:center;gap:8px;min-height:26px;margin:-4px -8px -2px 0}
.card-cat{display:inline-flex;align-items:center;font-size:.78em;font-weight:600;color:var(--muted);min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.card .pin{margin-left:auto;width:30px;height:30px;border-radius:8px}
.card .pin .ic{width:17px;height:17px}
.checkbox{width:20px;height:20px;border-radius:6px;border:1.5px solid var(--line-strong);display:grid;place-items:center;flex:none;background:var(--panel)}
.checkbox .ic{width:14px;height:14px;opacity:0;stroke-width:2.8}
.checkbox.on{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.checkbox.on .ic{opacity:1}
.card-title{font-size:1.04em;font-weight:650;line-height:1.3;letter-spacing:-.006em;overflow-wrap:anywhere}
.card-preview{font-family:var(--mono);font-size:.8em;line-height:1.6;color:var(--muted);white-space:pre-wrap;overflow-wrap:anywhere;overflow:hidden;display:-webkit-box;-webkit-box-orient:vertical;-webkit-line-clamp:var(--lines);line-clamp:var(--lines)}
.card-tags{display:flex;flex-wrap:wrap;gap:5px}
.card-foot{display:flex;align-items:center;gap:8px;margin-top:auto;padding-top:2px}
.card-stat{font-size:.79em;color:var(--faint);min-width:0;flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.card-actions{display:flex;gap:4px;flex:none}
.selecting .card-actions{visibility:hidden}

.cards.as-list .card{display:grid;grid-template-columns:minmax(150px,26%) minmax(0,1fr) auto;grid-template-areas:"title preview foot" "head tags foot";column-gap:18px;row-gap:2px;align-items:center;padding:9px 12px 9px 20px}
.as-list .card::before{top:8px;bottom:8px}
.as-list .card-head{grid-area:head;margin:0;min-height:24px}
.as-list .card .pin{width:26px;height:26px}
.as-list .card-title{grid-area:title;font-size:.97em}
.as-list .card-preview{grid-area:preview;-webkit-line-clamp:1;line-clamp:1}
.as-list .card-tags{grid-area:tags;flex-wrap:nowrap;overflow:hidden}
.as-list .card-foot{grid-area:foot;margin:0;padding:0}
.as-list .card-stat{flex:none;width:9em;text-align:right}

/* Empty state */
.empty{max-width:460px;padding:48px 4px}
.empty h2{font-size:1.4em;font-weight:700;letter-spacing:-.015em;margin-bottom:8px}
.empty p{color:var(--muted);margin-bottom:18px;line-height:1.6}
.empty-actions{display:flex;flex-wrap:wrap;gap:8px}

/* Drawer */
.scrim{position:fixed;inset:0;background:var(--overlay);opacity:0;pointer-events:none;transition:opacity .18s;z-index:50}
.scrim.on{opacity:1;pointer-events:auto}
.drawer{position:fixed;top:0;right:0;bottom:0;width:min(620px,100%);background:var(--panel);border-left:1px solid var(--line);z-index:60;display:flex;flex-direction:column;transform:translateX(104%);visibility:hidden;transition:transform .24s cubic-bezier(.2,.8,.2,1),visibility 0s linear .24s;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);box-shadow:var(--shadow)}
.drawer.open{transform:none;visibility:visible;transition:transform .24s cubic-bezier(.2,.8,.2,1),visibility 0s}
.drawer-head{display:flex;align-items:center;gap:4px;padding:10px 12px 10px 16px;border-bottom:1px solid var(--line);flex:none}
.drawer-heading{font-size:1.02em;font-weight:700}
.drawer-body{flex:1;min-height:0;overflow-y:auto;padding:22px 24px 28px;overscroll-behavior:contain}
.drawer-foot{display:flex;align-items:center;gap:8px;padding:12px 16px;border-top:1px solid var(--line);flex:none;flex-wrap:wrap}
.hint{font-size:.8em;color:var(--faint);display:inline-flex;align-items:center;gap:4px}
.d-top{display:flex;align-items:center;gap:12px;margin-bottom:10px;min-height:28px}
.d-cat{display:inline-flex;align-items:center;gap:7px;font-size:.85em;font-weight:600;color:var(--muted)}
.d-cat::before{content:"";width:10px;height:10px;border-radius:3px;background:var(--c)}
.d-top .stars{margin-left:auto}
.d-title{font-size:1.6em;line-height:1.18;font-weight:700;letter-spacing:-.02em;overflow-wrap:anywhere}
.d-meta{margin-top:7px;color:var(--muted);font-size:.87em}
.d-tags{display:flex;flex-wrap:wrap;gap:5px;margin-top:12px}
.d-section{margin-top:26px}
.d-section-head{display:flex;align-items:baseline;gap:12px;margin-bottom:10px}
.d-section h3{font-size:.9em;font-weight:650}
.d-count{margin-left:auto;font-size:.8em;color:var(--faint)}
.fill-field{display:grid;grid-template-columns:minmax(96px,32%) minmax(0,1fr);gap:12px;align-items:start;padding:8px 0;border-top:1px solid var(--line)}
.fill-field:first-of-type{border-top:0;padding-top:0}
.fill-field > .var{justify-self:start;margin-top:8px;font-size:.84em;overflow-wrap:anywhere}
.fill-field textarea{resize:none;min-height:40px;max-height:260px;overflow-y:auto}
.d-preview{font-family:var(--mono);font-size:.86em;line-height:1.7;white-space:pre-wrap;overflow-wrap:anywhere;background:var(--panel-2);border:1px solid var(--line);border-radius:var(--r);padding:14px 16px;-webkit-user-select:text;user-select:text}
.d-notes{white-space:pre-wrap;color:var(--muted);font-size:.93em;line-height:1.6}

.stars{display:inline-flex;gap:0}
.stars button{width:28px;height:28px;border:0;background:none;padding:0;display:grid;place-items:center;color:var(--faint);border-radius:6px}
.stars button .ic{width:18px;height:18px}
.stars button.on{color:var(--pin)}
.stars button.on .ic{fill:var(--pin)}
.stars:hover button .ic{fill:var(--pin);stroke:var(--pin)}
.stars:hover button:hover ~ button .ic{fill:none;stroke:var(--faint)}

.field{display:flex;flex-direction:column;gap:6px;margin-bottom:18px;min-width:0}
.label{font-size:.84em;font-weight:650;color:var(--muted)}
.label-row{display:flex;align-items:center;justify-content:space-between;gap:10px}
.field-row{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:18px;align-items:start}
.field-row .stars{height:38px;align-items:center}
textarea.mono{font-family:var(--mono);font-size:.88em;line-height:1.65;min-height:240px}
.body-meta{display:flex;gap:6px 12px;align-items:center;flex-wrap:wrap;font-size:.8em;color:var(--faint);margin-top:2px}
.body-meta .var{font-size:.92em}
.vars-list{display:inline-flex;flex-wrap:wrap;gap:4px 6px;align-items:center}
.help{font-size:.84em;color:var(--muted);margin:-8px 0 20px;line-height:1.55}
.tag-input{display:flex;flex-wrap:wrap;gap:5px;align-items:center;min-height:40px;padding:5px 6px;border:1px solid var(--line);border-radius:8px;background:var(--panel);cursor:text}
.tag-input:focus-within{border-color:var(--focus);box-shadow:0 0 0 3px color-mix(in srgb,var(--focus) 24%,transparent)}
.tag-input input[type="text"]{flex:1;min-width:120px;border:0;padding:3px 4px;background:none;box-shadow:none}
.tag-input input[type="text"]:focus{box-shadow:none}
.history{border-top:1px solid var(--line);padding-top:12px}
.history summary{cursor:pointer;font-weight:650;font-size:.88em;color:var(--muted);padding:4px 0}
.history-list{list-style:none;margin:10px 0 0;padding:0;display:flex;flex-direction:column;gap:10px}
.history-list li{border:1px solid var(--line);border-radius:var(--r);padding:10px 12px;background:var(--panel-2)}
.h-meta{font-size:.8em;color:var(--faint)}
.h-body{font-family:var(--mono);font-size:.78em;white-space:pre-wrap;overflow-wrap:anywhere;margin:6px 0 10px;color:var(--muted);max-height:8.5em;overflow:hidden}

/* Modal */
.modal-wrap{position:fixed;inset:0;z-index:80;display:grid;place-items:center;padding:max(16px,env(safe-area-inset-top,0px)) 16px max(16px,env(safe-area-inset-bottom,0px));background:var(--overlay)}
.modal-wrap[hidden]{display:none}
.modal{background:var(--panel);border:1px solid var(--line);border-radius:var(--r-lg);width:min(440px,100%);max-height:100%;display:flex;flex-direction:column;box-shadow:var(--shadow);min-height:0}
.modal.wide{width:min(700px,100%)}
.modal-head{padding:16px 14px 6px 22px;display:flex;align-items:center;gap:8px;flex:none}
.modal-head h2{font-size:1.14em;font-weight:700;letter-spacing:-.01em;flex:1}
.modal-body{padding:6px 22px 18px;overflow-y:auto;min-height:0}
.modal-text{color:var(--muted);line-height:1.55}
.modal-foot{padding:12px 16px;display:flex;justify-content:flex-end;flex-wrap:wrap;gap:8px;border-top:1px solid var(--line);flex:none}

.settings{display:flex;flex-direction:column;gap:24px}
.set-section h3{font-size:.95em;font-weight:700;margin-bottom:4px}
.set-row{display:grid;grid-template-columns:150px minmax(0,1fr);gap:8px 16px;align-items:center;padding:11px 0;border-top:1px solid var(--line)}
.set-label{font-size:.88em;color:var(--muted);font-weight:600}
.set-row > .seg,.set-row > .swatches,.set-row > .checks,.set-row > .range-row{justify-self:start}
.set-row > .range-row{width:100%}
.set-note{font-size:.86em;color:var(--muted);margin:2px 0 12px;line-height:1.55}
.checks{display:flex;flex-wrap:wrap;gap:8px 18px}
.check{display:inline-flex;align-items:center;gap:8px;font-size:.92em;cursor:pointer}
.check input{width:16px;height:16px;accent-color:var(--accent);margin:0;flex:none}
.radios{flex-wrap:wrap}
.radios label{position:relative;display:inline-flex}
.radios input{position:absolute;inset:0;opacity:0;margin:0;cursor:pointer}
.radios span{display:inline-flex;align-items:center;height:30px;padding:0 11px;border-radius:7px;color:var(--muted);font-weight:600;font-size:.86em}
.radios input:checked + span{background:var(--panel);color:var(--ink);box-shadow:0 0 0 1px var(--line)}
.radios input:focus-visible + span{outline:2px solid var(--focus);outline-offset:1px}
.swatches{display:flex;gap:12px;flex-wrap:wrap;align-items:center}
.swatch{position:relative;display:inline-grid;place-items:center}
.swatch input{position:absolute;inset:0;opacity:0;margin:0;cursor:pointer}
.swatch .sw{width:28px;height:28px;border-radius:50%;box-shadow:inset 0 0 0 1px rgba(0,0,0,.14)}
.swatch input:checked + .sw{box-shadow:0 0 0 2px var(--panel),0 0 0 4px var(--ink)}
.swatch input:focus-visible + .sw{outline:2px solid var(--focus);outline-offset:5px}
.range-row{display:flex;align-items:center;gap:12px}
.range-row input{flex:1;accent-color:var(--accent);max-width:260px}
.range-row output{font-size:.88em;color:var(--muted);min-width:4.5em}
.data-actions{display:flex;flex-wrap:wrap;gap:8px}
.set-row > .pack-row{justify-self:stretch}
.pack-row{display:flex;flex-direction:column;gap:8px;min-width:0}
.pack-about{font-size:.88em;color:var(--muted);line-height:1.5}
.pack-row .data-actions:empty{display:none}
.cat-manage{display:flex;flex-direction:column;gap:6px;margin:14px 0}
.cat-row{display:flex;align-items:center;gap:6px}
.cat-row input[type="color"]{width:36px;height:36px;padding:3px;border:1px solid var(--line);border-radius:8px;background:var(--panel);cursor:pointer;flex:none}
.cat-row input[type="text"]{flex:1;min-width:0}
.cat-row .count{width:2.6em;text-align:right;color:var(--faint);font-size:.84em;font-variant-numeric:tabular-nums;flex:none}
.cat-add-row{display:flex;gap:8px}
.keys{width:100%;border-collapse:collapse}
.keys td{padding:8px 0;border-top:1px solid var(--line);font-size:.92em;vertical-align:top}
.keys tr:first-child td{border-top:0}
.keys td:first-child{width:42%;white-space:nowrap;padding-right:12px}
.keys kbd + kbd{margin-left:3px}

/* Toasts */
.toasts{position:fixed;left:50%;bottom:0;transform:translateX(-50%);padding:0 12px calc(18px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;align-items:center;gap:8px;z-index:90;pointer-events:none;width:max-content;max-width:100%}
.toast{pointer-events:auto;background:var(--ink);color:var(--bg);padding:10px 12px 10px 16px;border-radius:12px;display:flex;gap:14px;align-items:center;font-size:.9em;max-width:min(540px,94vw);box-shadow:var(--shadow);animation:toast-in .2s ease-out}
.toast.toast-warn{background:var(--danger);color:#fff}
.toast.out{opacity:0;transform:translateY(6px);transition:opacity .16s,transform .16s}
.toast-btn{border:0;background:none;color:inherit;font-weight:700;text-decoration:underline;text-underline-offset:3px;padding:4px;flex:none}
@keyframes toast-in{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}

/* Narrow screens */
@media (max-width: 880px){
  .app{grid-template-columns:minmax(0,1fr)}
  .sidebar{position:fixed;top:0;bottom:0;left:0;width:min(300px,86vw);z-index:65;transform:translateX(-102%);visibility:hidden;transition:transform .22s cubic-bezier(.2,.8,.2,1),visibility 0s linear .22s;padding-top:calc(18px + env(safe-area-inset-top,0px));padding-bottom:calc(14px + env(safe-area-inset-bottom,0px));box-shadow:var(--shadow)}
  .app[data-sidebar="open"] .sidebar{transform:none;visibility:visible;transition:transform .22s cubic-bezier(.2,.8,.2,1),visibility 0s}
  .menu-btn,.close-side{display:inline-grid}
  .toolbar{padding:10px 14px}
  .content{padding:12px 14px 48px}
  .filterbar .hint{display:none}
}
@media (max-width: 640px){
  .search{order:-1;flex-basis:calc(100% - 46px);max-width:none}
  .menu-btn{order:-2}
  .search kbd,.hide-sm{display:none}
  .toolbar .spacer{display:none}
  .new-label{display:none}
  #newBtn{width:38px;padding:0;margin-left:auto}
  .toolbar{gap:6px}
  .tb-group select.control{max-width:140px}
  #viewSeg > button.icon-only{width:30px}
  .cards.as-cards{grid-template-columns:minmax(0,1fr)}
  .cards.as-list .card{grid-template-columns:minmax(0,1fr) auto;grid-template-areas:"head head" "title title" "preview preview" "tags foot";row-gap:4px}
  .as-list .card-stat{display:none}
  .drawer-body{padding:18px 16px 24px}
  .fill-field{grid-template-columns:minmax(0,1fr);gap:6px}
  .fill-field > .var{margin-top:0}
  .field-row{grid-template-columns:minmax(0,1fr);gap:0}
  .set-row{grid-template-columns:minmax(0,1fr)}
  .d-title{font-size:1.4em}
}
@media (prefers-reduced-motion: reduce){
  *,*::before,*::after{transition-duration:0s!important;animation:none!important}
}

<body>
<div class="app" id="app" data-sidebar="closed">
  <aside class="sidebar" id="sidebar" aria-label="Library"></aside>
  <main class="main">
    <header class="toolbar">
      <button class="icon-btn menu-btn" id="menuBtn" data-icon="menu" aria-label="Show categories and tags" aria-expanded="false"></button>
      <div class="search">
        <span data-icon="search"></span>
        <input id="q" type="search" placeholder="Search prompts or #tags" aria-label="Search prompts" autocomplete="off" spellcheck="false">
        <kbd>/</kbd>
      </div>
      <div class="tb-group">
        <div class="select-wrap"><select id="sortSel" class="control" aria-label="Sort prompts by"></select><span data-icon="chev"></span></div>
        <button class="icon-btn" id="dirBtn" aria-label="Reverse sort order"></button>
      </div>
      <div class="seg" id="viewSeg" aria-label="Layout">
        <button class="icon-only" data-view="cards" data-icon="cards" aria-label="Card layout" title="Card layout"></button>
        <button class="icon-only" data-view="list" data-icon="list" aria-label="List layout" title="List layout"></button>
      </div>
      <button class="icon-btn" id="selectBtn" data-icon="select" aria-label="Select several prompts" title="Select several prompts" aria-pressed="false"></button>
      <span class="spacer"></span>
      <button class="btn primary" id="newBtn" data-icon="plus" aria-label="New prompt"><span class="new-label">New prompt</span></button>
    </header>
    <div class="content" id="content">
      <div class="bulkbar" id="bulkbar" hidden></div>
      <div class="filterbar" id="filterbar"></div>
      <div id="cards" class="cards as-cards"></div>
    </div>
  </main>
</div>
<div class="scrim" id="scrim"></div>
<section class="drawer" id="drawer" role="dialog" aria-modal="true" aria-labelledby="drawerTitle"></section>
<div class="modal-wrap" id="modalWrap" hidden></div>
<div class="toasts" id="toasts"></div>
<input type="file" id="fileInput" accept=".json,.csv,application/json,text/csv" hidden>

  (Array.isArray(s.prompts) ? s.prompts : []).forEach((p, i) => {
    if (!p || typeof p !== 'object') return;

    if (pseen.has(n.id)) n.id = uid();
    pseen.add(n.id);
    if (n.categoryId && !seen.has(n.categoryId)) n.categoryId = null;

}

const PACKS = {
  starter: { label: 'Starter prompts', about: 'Writing, code review, meetings, email, research, and learning.', build: starterPack },
  'secdev-1': { label: 'Security and dev', about: 'Scripts and CLI tools in Bash, Python, Node, Go, and PowerShell, no-dependency web apps and extensions, test, fuzz, eval, and load harnesses, detection and threat hunting, incident response, authorized testing, AI security, and audits.', build: secdevPack }
};
// Each release is added once to every library, including libraries saved before it existed.
const RELEASES = [
  { id: 'secdev-1', pack: 'secdev-1', only: p => !p.id.startsWith('sd2-') },
  { id: 'secdev-2', pack: 'secdev-1', only: p => p.id.startsWith('sd2-') }
];
function releaseData(r) {
  const d = PACKS[r.pack].build();
  if (r.only) {
    d.prompts = d.prompts.filter(r.only);
    const used = new Set(d.prompts.map(p => p.categoryId));
    d.categories = d.categories.filter(c => used.has(c.id));
  }
  return d;
}

function seedState() {
  const a = starterPack(), b = secdevPack();
  const prompts = [...a.prompts, ...b.prompts.map((p, i) => ({ ...p, order: a.prompts.length + i }))];
  return normalize({ version: 1, updatedAt: 0, seeded: true, packs: [...new Set([...Object.keys(PACKS), ...RELEASES.map(r => r.id)])], settings: DEFAULT_SETTINGS, categories: [...a.categories, ...b.categories], prompts });
}

const SORTS = {
  uses:     { label: 'Most used',          dir: 'desc', cmp: (a, b) => a.uses - b.uses },
  trending: { label: 'Most used this week', dir: 'desc', cmp: (a, b) => weekUses(a) - weekUses(b) },
  lastUsed: { label: 'Recently used',      dir: 'desc', cmp: (a, b) => (a.lastUsed || 0) - (b.lastUsed || 0) },
  updated:  { label: 'Recently edited',    dir: 'desc', cmp: (a, b) => a.updatedAt - b.updatedAt },
  created:  { label: 'Date added',         dir: 'desc', cmp: (a, b) => a.createdAt - b.createdAt },
  title:    { label: 'Title',              dir: 'asc',  cmp: titleCmp },
  rating:   { label: 'Rating',             dir: 'desc', cmp: (a, b) => a.rating - b.rating },
  category: { label: 'Category',           dir: 'asc',  cmp: (a, b, ci) => (ci.has(a.categoryId) ? ci.get(a.categoryId) : 1e6) - (ci.has(b.categoryId) ? ci.get(b.categoryId) : 1e6) },
  custom:   { label: 'Your order',         dir: 'asc',  cmp: (a, b) => a.order - b.order }
};

let localOK = true;
function load() {
  try {
    const raw = localStorage.getItem(LS_KEY);
    if (raw) return normalize(JSON.parse(raw));
  } catch (e) { /* fall through to samples */ }
  return seedState();
}
function writeLocal() {
  try { localStorage.setItem(LS_KEY, JSON.stringify(state)); localOK = true; }
  catch (e) { localOK = false; }
}

const undoStack = [];

/* Call after any change to the library. */
function commit(opts) {
  state.updatedAt = Date.now();
  state.seeded = false;
  writeLocal();
  Sync.schedule();
  if (!(opts && opts.silent)) render();
}
function snapshot(label) {
  undoStack.push({ label, data: JSON.stringify({ prompts: state.prompts, categories: state.categories }) });
  if (undoStack.length > 25) undoStack.shift();
}
function undo() {
  const s = undoStack.pop();
  if (!s) { toast('Nothing to undo.'); return; }
  const d = JSON.parse(s.data);
  state.prompts = d.prompts;
  state.categories = d.categories;
  commit();
  refreshOpenViews();
  toast(`Undid ${s.label}.`);
}

const getPrompt = id => state.prompts.find(p => p.id === id) || null;
const catMap = () => new Map(state.categories.map(c => [c.id, c]));
const isRecent = p => !!p.lastUsed && Date.now() - p.lastUsed < 30 * DAY;
function weekUses(p) { const cut = Date.now() - 7 * DAY; let n = 0; for (const t of p.recent) if (t > cut) n++; return n; }
const allTags = () => { const s = new Map(); state.prompts.forEach(p => p.tags.forEach(t => s.set(t, (s.get(t) || 0) + 1))); return [...s.entries()].sort((a, b) => b[1] - a[1] || a[0].localeCompare(b[0])); };
const nextColor = () => { const used = new Set(state.categories.map(c => c.color.toLowerCase())); return PALETTE.find(c => !used.has(c.toLowerCase())) || PALETTE[state.categories.length % PALETTE.length]; };

function captureFocus(root) {
  const a = document.activeElement;
  if (!a || !root.contains(a) || a === root) return null;
  const card = a.closest('[data-id]');
  return { id: card ? card.dataset.id : null, act: a.dataset.act || null, scope: a.dataset.scope || null, sact: a.dataset.sact || null, tag: a.dataset.tag || null, bact: a.dataset.bact || null, fact: a.dataset.fact || null };
}
function restoreFocus(root, k) {
  if (!k) return;
  let el = null;
  if (k.id) {
    const c = root.querySelector(`[data-id="${cssId(k.id)}"]`);
    if (c) el = (k.act && c.querySelector(`[data-act="${k.act}"]`)) || c;
  } else if (k.scope) el = root.querySelector(`[data-scope="${cssId(k.scope)}"]`);
  else if (k.sact) el = root.querySelector(`[data-sact="${k.sact}"]`);
  else if (k.tag) el = root.querySelector(`[data-tag="${cssId(k.tag)}"]`);
  else if (k.bact) el = root.querySelector(`[data-bact="${k.bact}"]`);
  else if (k.fact) el = root.querySelector(`[data-fact="${k.fact}"]`);
  if (el) el.focus({ preventScroll: true });
}

function syncLabel() {

}

function renderToolbar() {

  dirBtn.setAttribute('aria-label', asc ? 'Sort ascending, click to reverse' : 'Sort descending, click to reverse');
  $$('button', viewSeg).forEach(b => b.setAttribute('aria-pressed', String(b.dataset.view === s.view)));

function visiblePrompts() {
  const cmap = catMap();
  const terms = ui.q.toLowerCase().trim().split(/\s+/).filter(Boolean);
  const tagTerms = [], words = [];
  terms.forEach(t => { if (t.length > 1 && t[0] === '#') tagTerms.push(t.slice(1)); else words.push(t); });
  const sc = ui.scope;
  const list = state.prompts.filter(p => {
    if (sc === 'pinned' && !p.pinned) return false;
    if (sc === 'recent' && !isRecent(p)) return false;
    if (sc === 'unused' && p.uses) return false;
    if (sc === 'uncat' && p.categoryId) return false;
    if (sc.startsWith('cat:') && p.categoryId !== sc.slice(4)) return false;
    for (const t of ui.tags) if (!p.tags.includes(t)) return false;
    for (const t of tagTerms) if (!p.tags.some(x => x.includes(t))) return false;
    if (words.length) {
      const c = cmap.get(p.categoryId);
      const hay = (p.title + '\n' + p.body + '\n' + p.notes + '\n' + p.tags.join(' ') + '\n' + (c ? c.name : '')).toLowerCase();
      for (const w of words) if (!hay.includes(w)) return false;
    }
    return true;
  });
  const s = state.settings, def = SORTS[s.sort] || SORTS.uses;
  const dir = s.sort === 'custom' ? 1 : (s.sortDir === 'asc' ? 1 : -1);
  const ci = new Map(state.categories.map((c, i) => [c.id, i]));
  list.sort((a, b) => {
    if (s.pinnedFirst && a.pinned !== b.pinned) return a.pinned ? -1 : 1;
    return (def.cmp(a, b, ci) * dir) || titleCmp(a, b);
  });
  return list;
}

  if (ui.scope !== 'all') parts.push(chip(scopeLabel(ui.scope), 'scope'));

    const ta = document.createElement('textarea');
    ta.value = text; ta.setAttribute('readonly', '');
    ta.style.cssText = 'position:fixed;top:0;left:0;width:1px;height:1px;opacity:0;';
    document.body.appendChild(ta);

function toast(msg, o) {

  el.innerHTML = `<span class="toast-msg">${esc(msg)}</span>${o.action ? `<button class="toast-btn">${esc(o.action)}</button>` : ''}`;
  let tm;
  const remove = () => { clearTimeout(tm); el.classList.add('out'); setTimeout(() => el.remove(), 180); };
  if (o.action) $('.toast-btn', el).addEventListener('click', () => { remove(); if (o.onAction) o.onAction(); });
  toasts.appendChild(el);
  while (toasts.children.length > 3) toasts.firstElementChild.remove();
  tm = setTimeout(remove, o.timeout || 3200);
  el.addEventListener('mouseenter', () => clearTimeout(tm));
  el.addEventListener('mouseleave', () => { tm = setTimeout(remove, 1600); });
}

      return;
    }
    if (e.target.id === 'tagBox') { $('#fTagInput', drawer).focus(); return; }
    const b = e.target.closest('[data-dact]');
    if (!b) return;
    const p = d.id ? getPrompt(d.id) : null;
    switch (b.dataset.dact) {
      case 'close': requestCloseDrawer(); break;
      case 'mode': switchMode(b.dataset.mode); break;
      case 'pin': if (p) { p.pinned = !p.pinned; commit(); renderDrawer(); const pb = $('[data-dact="pin"]', drawer); if (pb) pb.focus(); } break;
      case 'duplicate': if (p) duplicate(p); break;
      case 'delete': if (p) deletePrompts([p.id]); break;
      case 'copy': copyFromDrawer(); break;
      case 'clear-vars': d.values = {}; renderDrawer(); focusDrawer(); break;
      case 'save': saveDraft(); break;
      case 'cancel': cancelEdit(); break;
      case 'insert-var': insertVar(); break;
      case 'rm-tag': d.draft.tags = d.draft.tags.filter(t => t !== b.dataset.tag); d.dirty = true; updateTagBox(); $('#fTagInput', drawer).focus(); break;
      case 'restore': if (p) {
        const h = p.history[+b.dataset.idx];
        if (!h) break;
        const ta = $('#fBody', drawer);
        d.draft.body = h.body; d.dirty = true;
        if (ta) { ta.value = h.body; ta.focus(); ta.setSelectionRange(0, 0); ta.scrollTop = 0; }
        updateBodyMeta();
        toast('That version is in the editor. Save changes to keep it.');
      } break;
    }
  });
  drawer.addEventListener('input', e => {
    const d = ui.drawer, t = e.target;
    if (!d) return;
    if (t.dataset.var != null) {
      d.values[t.dataset.var] = t.value;
      autosize(t);
      const pv = $('#dPreview', drawer), p = getPrompt(d.id);
      if (pv && p) pv.innerHTML = filledHTML(p.body, d.values);
      return;
    }
    if (t.id === 'fTitle') { d.draft.title = t.value; d.dirty = true; }
    else if (t.id === 'fBody') { d.draft.body = t.value; d.dirty = true; updateBodyMeta(); }
    else if (t.id === 'fNotes') { d.draft.notes = t.value; d.dirty = true; autosize(t); }
  });
  drawer.addEventListener('change', async e => {
    const d = ui.drawer;
    if (!d || e.target.id !== 'fCat') return;
    const sel = e.target;
    if (sel.value === '__new') {
      const name = await promptModal({ title: 'New category', label: 'Name', placeholder: 'e.g. Marketing', confirm: 'Add category' });
      if (!ui.drawer) return;
      if (name) { const c = addCategory(name); if (c) { ui.drawer.draft.categoryId = c.id; ui.drawer.dirty = true; } }
      const s2 = $('#fCat', drawer);
      if (s2) { s2.innerHTML = catOptions(ui.drawer.draft.categoryId); s2.value = ui.drawer.draft.categoryId || ''; s2.focus(); }
    } else { d.draft.categoryId = sel.value || null; d.dirty = true; }
  });
  drawer.addEventListener('keydown', e => {
    const t = e.target;
    if (t.id !== 'fTagInput') return;
    if ((e.key === 'Enter' || e.key === ',') && t.value.trim()) { e.preventDefault(); addDraftTags(t.value); t.value = ''; }
    else if (e.key === 'Enter') e.preventDefault();
    else if (e.key === 'Backspace' && !t.value && ui.drawer.draft.tags.length) { ui.drawer.draft.tags.pop(); ui.drawer.dirty = true; updateTagBox(); }
  });
  drawer.addEventListener('focusout', e => { if (e.target.id === 'fTagInput' && e.target.value.trim() && ui.drawer) { addDraftTags(e.target.value); e.target.value = ''; } });

  // Global keys
  document.addEventListener('keydown', e => {
    if (e.defaultPrevented) return;
    const mod = e.metaKey || e.ctrlKey;
    if (!modalWrap.hidden) {
      if (e.key === 'Escape') { e.preventDefault(); closeModal(null); }
      else if (e.key === 'Tab') trapTab(e, modalWrap);
      return;
    }
    if (ui.drawer) {
      if (e.key === 'Escape') { e.preventDefault(); requestCloseDrawer(); }
      else if (e.key === 'Tab') trapTab(e, drawer);
      else if (mod && e.key === 'Enter') { e.preventDefault(); ui.drawer.mode === 'use' ? copyFromDrawer() : saveDraft(); }
      else if (mod && (e.key === 's' || e.key === 'S')) { e.preventDefault(); if (ui.drawer.mode === 'edit') saveDraft(); }
      return;
    }
    if (mod && (e.key === 'k' || e.key === 'K')) { e.preventDefault(); qInput.focus(); qInput.select(); return; }
    const typing = /^(INPUT|TEXTAREA|SELECT)$/.test(e.target.tagName) || e.target.isContentEditable;
    if (typing) {
      if (e.key === 'Escape' && e.target === qInput) {
        if (qInput.value) { qInput.value = ''; ui.q = ''; renderList(); } else qInput.blur();
      }
      return;
    }
    if (mod && (e.key === 'z' || e.key === 'Z') && !e.shiftKey) { e.preventDefault(); undo(); return; }
    if (mod || e.altKey) return;
    if (e.key === '/') { e.preventDefault(); qInput.focus(); qInput.select(); }
    else if (e.key === 'n' || e.key === 'N') { e.preventDefault(); openDrawer(null, 'edit'); }
    else if (e.key === '?') { e.preventDefault(); openShortcuts(); }
    else if (e.key === 'Escape') { if (ui.sidebarOpen) { setSidebar(false); menuBtn.focus(); } else if (ui.selectMode) setSelectMode(false); }
  });

  // Another tab of this page saved a newer library
  window.addEventListener('storage', e => {
    if (e.key !== LS_KEY || !e.newValue) return;
    try {
      const s = normalize(JSON.parse(e.newValue));
      if (s.updatedAt > state.updatedAt) { state = s; render(); refreshOpenViews(); }
    } catch (err) { /* ignore a partial write */ }
  });
}

/* ================= Start ================= */
function init() {
  $$('[data-icon]').forEach(el => {
    const svg = icon(el.dataset.icon);
    if (el.tagName === 'SPAN' && !el.children.length && !el.textContent.trim()) el.outerHTML = svg;
    else el.insertAdjacentHTML('afterbegin', svg);
  });
  sortSel.innerHTML = Object.entries(SORTS).map(([k, v]) => `<option value="${k}">${v.label}</option>`).join('');
  try { if (!localStorage.getItem(LS_KEY)) writeLocal(); } catch (e) { localOK = false; }
  bind();
  render();
  Sync.init();
}
init();
})();

</script>
</body>
