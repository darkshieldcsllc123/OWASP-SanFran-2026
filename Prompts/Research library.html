<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Research library</title>
<style>
:root{
  color-scheme:light;
  --bg:#E7EBEF;
  --panel:#FFFFFF;
  --panel-2:#F3F5F8;
  --sunk:#DCE2E8;
  --ink:#16202A;
  --muted:#55606E;
  --faint:#7F8A98;
  --line:#D2D8DF;
  --line-strong:#ABB5C1;
  --accent:#16202A;
  --accent-ink:#FFFFFF;
  --hl:#FFE36E;
  --hl-ink:#1D1A0E;
  --pin:#D39314;
  --danger:#B83A27;
  --ok:#2C7A55;
  --focus:#2F6BEA;
  --overlay:rgba(22,32,42,.42);
  --shadow:0 24px 60px -20px rgba(22,32,42,.45);
  --fs:15px;
  --r-sm:7px;
  --r:10px;
  --r-lg:16px;
  --gap:14px;
  --card-pad:14px 16px 12px 20px;
  --lines:4;
  --ui:"Avenir Next","Segoe UI Variable Text","Segoe UI",system-ui,-apple-system,"Helvetica Neue",Roboto,Arial,sans-serif;
  --mono:ui-monospace,"SF Mono","Cascadia Code","JetBrains Mono",Menlo,Consolas,"Liberation Mono",monospace;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    color-scheme:dark;
    --bg:#151B22;--panel:#1E252E;--panel-2:#192028;--sunk:#29313C;
    --ink:#E6EBF1;--muted:#A2ADBA;--faint:#7D8896;--line:#303945;--line-strong:#465261;
    --accent:#E6EBF1;--accent-ink:#151B22;--hl:#E9C94A;--hl-ink:#17150A;--pin:#F0C04A;
    --danger:#F08A73;--ok:#74C9A1;--focus:#7FA6FF;--overlay:rgba(6,9,13,.62);--shadow:0 24px 60px -20px rgba(0,0,0,.75);
  }
}
:root[data-theme="dark"]{
  color-scheme:dark;
  --bg:#151B22;--panel:#1E252E;--panel-2:#192028;--sunk:#29313C;
  --ink:#E6EBF1;--muted:#A2ADBA;--faint:#7D8896;--line:#303945;--line-strong:#465261;
  --accent:#E6EBF1;--accent-ink:#151B22;--hl:#E9C94A;--hl-ink:#17150A;--pin:#F0C04A;
  --danger:#F08A73;--ok:#74C9A1;--focus:#7FA6FF;--overlay:rgba(6,9,13,.62);--shadow:0 24px 60px -20px rgba(0,0,0,.75);
}
:root[data-density="compact"]{--gap:9px;--card-pad:10px 12px 9px 16px}

*,*::before,*::after{box-sizing:border-box}
html{height:100%;background:var(--bg);scroll-padding-top:env(safe-area-inset-top,0px);-webkit-text-size-adjust:100%;text-size-adjust:100%}
body{height:100%;margin:0;background:var(--bg);color:var(--ink);font-family:var(--ui);font-size:var(--fs);line-height:1.5;-webkit-font-smoothing:antialiased;overflow:hidden}
button,input,select,textarea{font:inherit;color:inherit;letter-spacing:inherit}
button{cursor:pointer;-webkit-tap-highlight-color:transparent}
button:disabled,select:disabled{cursor:not-allowed;opacity:.45}
:focus-visible{outline:2px solid var(--focus);outline-offset:2px}
h1,h2,h3,p{margin:0}
.sr-only{position:absolute!important;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0}
.grow{flex:1 1 auto}
.muted{color:var(--muted)}
.ic{width:18px;height:18px;flex:none;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
kbd{font-family:var(--mono);font-size:.74em;line-height:1;padding:3px 6px;border:1px solid var(--line);border-bottom-width:2px;border-radius:5px;background:var(--panel);color:var(--muted);white-space:nowrap}
code{font-family:var(--mono);font-size:.88em;background:var(--sunk);padding:1px 5px;border-radius:4px}
mark{background:color-mix(in srgb,var(--focus) 22%,transparent);color:inherit;border-radius:3px;padding:0 1px}

/* The highlighter: fill-in fields are marked like a pen swipe */
.var{font-family:var(--mono);font-size:.94em;color:var(--hl-ink);background:linear-gradient(100deg,transparent 0 .1em,var(--hl) .26em calc(100% - .26em),transparent calc(100% - .1em));padding:.04em .36em;margin:0 -.04em;border-radius:.32em .18em .36em .14em;-webkit-box-decoration-break:clone;box-decoration-break:clone}
.filled{background:linear-gradient(transparent 60%,var(--hl) 60%);-webkit-box-decoration-break:clone;box-decoration-break:clone}
.filled.is-default{background:linear-gradient(transparent 60%,var(--sunk) 60%)}

/* Controls */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:7px;height:38px;padding:0 14px;border-radius:var(--r);border:1px solid var(--line);background:var(--panel);color:var(--ink);font-weight:600;font-size:.92em;white-space:nowrap;transition:background-color .12s,border-color .12s,color .12s}
.btn:hover:not(:disabled){border-color:var(--line-strong)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.primary:hover:not(:disabled){filter:brightness(1.12);border-color:var(--accent)}
.btn.ghost{background:transparent;border-color:transparent}
.btn.ghost:hover:not(:disabled){background:var(--sunk);border-color:transparent}
.btn.danger{color:var(--danger)}
.btn.danger-solid{background:var(--danger);border-color:var(--danger);color:#fff}
.btn.sm{height:30px;padding:0 10px;font-size:.84em;border-radius:8px;gap:6px}
.btn.sm .ic{width:16px;height:16px}
.btn.copied{background:var(--ok);border-color:var(--ok);color:#fff}
.icon-btn{width:38px;height:38px;display:inline-grid;place-items:center;border-radius:var(--r);border:1px solid transparent;background:none;color:var(--muted);flex:none;padding:0}
.icon-btn:hover:not(:disabled){background:var(--sunk);color:var(--ink)}
.icon-btn[aria-pressed="true"]{background:var(--panel);border-color:var(--line);color:var(--ink)}
.icon-btn.sm{width:30px;height:30px;border-radius:8px}
.icon-btn.sm .ic{width:16px;height:16px}
.pin.on,.pin.on[aria-pressed="true"]{color:var(--pin);background:none;border-color:transparent}
.pin.on:hover{background:var(--sunk)}
.pin.on .ic{fill:var(--pin);stroke:var(--pin)}
.link{border:0;background:none;padding:0;color:var(--muted);text-decoration:underline;text-decoration-color:var(--line-strong);text-underline-offset:3px;font-size:.88em;font-weight:500}
.link:hover{color:var(--ink);text-decoration-color:currentColor}
.seg{display:inline-flex;padding:3px;background:var(--sunk);border-radius:var(--r);gap:2px;flex:none}
.seg > button{height:30px;border:0;background:none;padding:0 11px;border-radius:7px;color:var(--muted);font-weight:600;font-size:.88em;display:inline-flex;align-items:center;gap:6px}
.seg > button.icon-only{width:34px;padding:0;justify-content:center}
.seg > button:hover{color:var(--ink)}
.seg > button[aria-pressed="true"],.seg > button[aria-selected="true"]{background:var(--panel);color:var(--ink);box-shadow:0 0 0 1px var(--line)}
.select-wrap{position:relative;display:inline-flex;flex:none}
.select-wrap .ic{position:absolute;right:9px;top:50%;transform:translateY(-50%);pointer-events:none;color:var(--muted);width:16px;height:16px}
select.control{appearance:none;-webkit-appearance:none;height:38px;border:1px solid var(--line);background:var(--panel);border-radius:var(--r);padding:0 32px 0 12px;font-size:.92em;font-weight:500;cursor:pointer;max-width:100%}
select.control.sm{height:30px;font-size:.84em;border-radius:8px;padding-left:10px}
select.control.full{width:100%}
.select-wrap.full{display:flex;width:100%}
input[type="text"],input[type="search"],textarea{width:100%;border:1px solid var(--line);background:var(--panel);border-radius:8px;padding:9px 11px;line-height:1.45;font-size:.95em}
input[type="text"]:focus,input[type="search"]:focus,textarea:focus,select.control:focus{outline:none;border-color:var(--focus);box-shadow:0 0 0 3px color-mix(in srgb,var(--focus) 24%,transparent)}
textarea{resize:vertical}
::placeholder{color:var(--faint);opacity:1}
input[list]::-webkit-calendar-picker-indicator{display:none!important;opacity:0}

/* Layout */
.app{height:100%;display:grid;grid-template-columns:262px minmax(0,1fr)}
.sidebar{background:var(--panel-2);border-right:1px solid var(--line);overflow-y:auto;padding:18px 12px 14px;display:flex;flex-direction:column;gap:22px;min-height:0}
.main{display:flex;flex-direction:column;min-width:0;min-height:0}
.toolbar{flex:none;display:flex;align-items:center;gap:8px;padding:12px 22px;border-bottom:1px solid var(--line);background:var(--bg);flex-wrap:wrap}
.menu-btn{display:none}
.search{position:relative;flex:1 1 240px;min-width:170px;max-width:540px}
.search > .ic{position:absolute;left:11px;top:50%;transform:translateY(-50%);color:var(--faint);pointer-events:none}
.search input{height:38px;padding:0 44px 0 36px;border-radius:var(--r)}
.search kbd{position:absolute;right:10px;top:50%;transform:translateY(-50%);pointer-events:none}
.search input:focus ~ kbd,.search input:not(:placeholder-shown) ~ kbd{display:none}
.tb-group{display:flex;align-items:center;gap:4px;flex:none}
.toolbar .spacer{flex:1 1 0;min-width:0}
.content{flex:1;min-height:0;overflow-y:auto;padding:14px 22px 56px;overscroll-behavior:contain}

/* Sidebar */
.brand{display:flex;align-items:center;gap:10px;padding:2px 8px}
.brand-mark{width:28px;height:28px;flex:none;color:var(--ink)}
.brand h1{font-size:1.08em;font-weight:700;letter-spacing:-.012em;flex:1}
.close-side{display:none}
.nav{display:flex;flex-direction:column;gap:1px}
.nav-item{display:flex;align-items:center;gap:10px;width:100%;min-height:34px;padding:6px 10px;border:0;background:none;border-radius:var(--r-sm);text-align:left;color:var(--ink);font-size:.93em;position:relative}
.nav-item:hover{background:var(--sunk)}
.nav-item[aria-current="true"]{background:var(--panel);box-shadow:0 0 0 1px var(--line);font-weight:650}
.nav-label{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.nav-item .count{margin-left:auto;color:var(--faint);font-size:.84em;font-variant-numeric:tabular-nums;font-weight:500}
.nav-item .dot{width:10px;height:10px;border-radius:3px;background:var(--c,var(--line-strong));flex:none}
.nav-item.drop-target{background:var(--panel);box-shadow:0 0 0 2px var(--accent)}
.side-head{display:flex;align-items:center;gap:2px;padding:0 2px 6px 10px}
.side-head h2{font-size:.82em;font-weight:650;color:var(--muted);flex:1}
.side-empty{font-size:.84em;color:var(--muted);padding:2px 10px;line-height:1.5}
.add-cat{padding:4px 4px 2px}
.add-cat input{height:34px;padding:0 10px}
.tag-cloud{display:flex;flex-wrap:wrap;gap:5px;padding:0 6px}
.more-tags{margin:8px 10px 0}
.side-foot{margin-top:auto;padding:12px 8px 0;border-top:1px solid var(--line);display:flex;flex-direction:column;gap:8px}
.stats{font-size:.82em;color:var(--muted)}
.sync{display:flex;align-items:flex-start;gap:8px;font-size:.8em;color:var(--muted);line-height:1.4}
.sync-dot{width:8px;height:8px;border-radius:50%;background:var(--faint);flex:none;margin-top:.35em}
.sync[data-state="synced"] .sync-dot{background:var(--ok)}
.sync[data-state="pending"] .sync-dot,.sync[data-state="saving"] .sync-dot,.sync[data-state="connecting"] .sync-dot{background:var(--pin)}
.sync[data-state="error"] .sync-dot,.sync[data-state="offline"] .sync-dot,.sync[data-state="blocked"] .sync-dot{background:var(--danger)}
.side-actions{display:flex;gap:2px;margin:0 -6px}

/* Tags */
.tag{display:inline-flex;align-items:center;gap:5px;height:24px;padding:0 8px;border-radius:999px;border:1px solid var(--line);background:transparent;color:var(--muted);font-size:.79em;line-height:1;white-space:nowrap}
button.tag:hover{color:var(--ink);border-color:var(--line-strong)}
.tag.on{background:var(--ink);border-color:var(--ink);color:var(--bg)}
.tag-n{color:var(--faint);font-variant-numeric:tabular-nums}
.tag.on .tag-n{color:inherit;opacity:.7}
.tag.static{cursor:default}
.chip{display:inline-flex;align-items:center;gap:2px;height:26px;padding:0 3px 0 10px;border-radius:999px;background:var(--panel);border:1px solid var(--line);font-size:.86em;color:var(--ink);max-width:100%}
.chip > span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.chip-x{width:20px;height:20px;border:0;background:none;border-radius:50%;display:grid;place-items:center;color:var(--muted);padding:0;flex:none}
.chip-x:hover{background:var(--sunk);color:var(--ink)}
.chip-x .ic{width:13px;height:13px;stroke-width:2.2}

/* Filter bar and bulk bar */
.filterbar{display:flex;align-items:center;gap:8px;flex-wrap:wrap;min-height:28px;margin-bottom:12px;font-size:.9em;color:var(--muted)}
.result-count{font-weight:600;color:var(--ink);margin-right:4px}
.filterbar .hint{margin-left:auto;font-size:.92em;color:var(--faint)}
.bulkbar{position:sticky;top:0;z-index:5;display:flex;flex-wrap:wrap;gap:6px;align-items:center;padding:8px 10px;margin:0 0 12px;background:var(--panel);border:1px solid var(--accent);border-radius:var(--r)}
.bulkbar[hidden]{display:none}
.bulk-count{font-size:.9em;margin:0 6px 0 4px}

/* Cards */
.cards.as-cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(272px,1fr));gap:var(--gap);align-items:stretch}
.cards.as-list{display:flex;flex-direction:column;gap:6px}
.card{position:relative;background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:var(--card-pad);display:flex;flex-direction:column;gap:8px;cursor:pointer;min-width:0;transition:border-color .12s}
.card::before{content:"";position:absolute;left:-1px;top:12px;bottom:12px;width:5px;border-radius:0 4px 4px 0;background:var(--cat)}
.card:hover{border-color:var(--line-strong)}
.card:focus-visible{outline:2px solid var(--focus);outline-offset:2px}
.card.is-selected{border-color:var(--accent);box-shadow:inset 0 0 0 1px var(--accent)}
.card.dragging{opacity:.4}
.card.drop-target{outline:2px dashed var(--accent);outline-offset:3px}
.card-head{display:flex;align-items:center;gap:8px;min-height:26px;margin:-4px -8px -2px 0}
.card-cat{display:inline-flex;align-items:center;font-size:.78em;font-weight:600;color:var(--muted);min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.card .pin{margin-left:auto;width:30px;height:30px;border-radius:8px}
.card .pin .ic{width:17px;height:17px}
.checkbox{width:20px;height:20px;border-radius:6px;border:1.5px solid var(--line-strong);display:grid;place-items:center;flex:none;background:var(--panel)}
.checkbox .ic{width:14px;height:14px;opacity:0;stroke-width:2.8}
.checkbox.on{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.checkbox.on .ic{opacity:1}
.card-title{font-size:1.04em;font-weight:650;line-height:1.3;letter-spacing:-.006em;overflow-wrap:anywhere}
.card-preview{font-family:var(--mono);font-size:.8em;line-height:1.6;color:var(--muted);white-space:pre-wrap;overflow-wrap:anywhere;overflow:hidden;display:-webkit-box;-webkit-box-orient:vertical;-webkit-line-clamp:var(--lines);line-clamp:var(--lines)}
.card-tags{display:flex;flex-wrap:wrap;gap:5px}
.card-foot{display:flex;align-items:center;gap:8px;margin-top:auto;padding-top:2px}
.card-stat{font-size:.79em;color:var(--faint);min-width:0;flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.card-actions{display:flex;gap:4px;flex:none}
.selecting .card-actions{visibility:hidden}

.cards.as-list .card{display:grid;grid-template-columns:minmax(150px,26%) minmax(0,1fr) auto;grid-template-areas:"title preview foot" "head tags foot";column-gap:18px;row-gap:2px;align-items:center;padding:9px 12px 9px 20px}
.as-list .card::before{top:8px;bottom:8px}
.as-list .card-head{grid-area:head;margin:0;min-height:24px}
.as-list .card .pin{width:26px;height:26px}
.as-list .card-title{grid-area:title;font-size:.97em}
.as-list .card-preview{grid-area:preview;-webkit-line-clamp:1;line-clamp:1}
.as-list .card-tags{grid-area:tags;flex-wrap:nowrap;overflow:hidden}
.as-list .card-foot{grid-area:foot;margin:0;padding:0}
.as-list .card-stat{flex:none;width:9em;text-align:right}

/* Empty state */
.empty{max-width:460px;padding:48px 4px}
.empty h2{font-size:1.4em;font-weight:700;letter-spacing:-.015em;margin-bottom:8px}
.empty p{color:var(--muted);margin-bottom:18px;line-height:1.6}
.empty-actions{display:flex;flex-wrap:wrap;gap:8px}

/* Drawer */
.scrim{position:fixed;inset:0;background:var(--overlay);opacity:0;pointer-events:none;transition:opacity .18s;z-index:50}
.scrim.on{opacity:1;pointer-events:auto}
.drawer{position:fixed;top:0;right:0;bottom:0;width:min(620px,100%);background:var(--panel);border-left:1px solid var(--line);z-index:60;display:flex;flex-direction:column;transform:translateX(104%);visibility:hidden;transition:transform .24s cubic-bezier(.2,.8,.2,1),visibility 0s linear .24s;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);box-shadow:var(--shadow)}
.drawer.open{transform:none;visibility:visible;transition:transform .24s cubic-bezier(.2,.8,.2,1),visibility 0s}
.drawer-head{display:flex;align-items:center;gap:4px;padding:10px 12px 10px 16px;border-bottom:1px solid var(--line);flex:none}
.drawer-heading{font-size:1.02em;font-weight:700}
.drawer-body{flex:1;min-height:0;overflow-y:auto;padding:22px 24px 28px;overscroll-behavior:contain}
.drawer-foot{display:flex;align-items:center;gap:8px;padding:12px 16px;border-top:1px solid var(--line);flex:none;flex-wrap:wrap}
.hint{font-size:.8em;color:var(--faint);display:inline-flex;align-items:center;gap:4px}
.d-top{display:flex;align-items:center;gap:12px;margin-bottom:10px;min-height:28px}
.d-cat{display:inline-flex;align-items:center;gap:7px;font-size:.85em;font-weight:600;color:var(--muted)}
.d-cat::before{content:"";width:10px;height:10px;border-radius:3px;background:var(--c)}
.d-top .stars{margin-left:auto}
.d-title{font-size:1.6em;line-height:1.18;font-weight:700;letter-spacing:-.02em;overflow-wrap:anywhere}
.d-meta{margin-top:7px;color:var(--muted);font-size:.87em}
.d-tags{display:flex;flex-wrap:wrap;gap:5px;margin-top:12px}
.d-section{margin-top:26px}
.d-section-head{display:flex;align-items:baseline;gap:12px;margin-bottom:10px}
.d-section h3{font-size:.9em;font-weight:650}
.d-count{margin-left:auto;font-size:.8em;color:var(--faint)}
.fill-field{display:grid;grid-template-columns:minmax(96px,32%) minmax(0,1fr);gap:12px;align-items:start;padding:8px 0;border-top:1px solid var(--line)}
.fill-field:first-of-type{border-top:0;padding-top:0}
.fill-field > .var{justify-self:start;margin-top:8px;font-size:.84em;overflow-wrap:anywhere}
.fill-field textarea{resize:none;min-height:40px;max-height:260px;overflow-y:auto}
.d-preview{font-family:var(--mono);font-size:.86em;line-height:1.7;white-space:pre-wrap;overflow-wrap:anywhere;background:var(--panel-2);border:1px solid var(--line);border-radius:var(--r);padding:14px 16px;-webkit-user-select:text;user-select:text}
.d-notes{white-space:pre-wrap;color:var(--muted);font-size:.93em;line-height:1.6}

.stars{display:inline-flex;gap:0}
.stars button{width:28px;height:28px;border:0;background:none;padding:0;display:grid;place-items:center;color:var(--faint);border-radius:6px}
.stars button .ic{width:18px;height:18px}
.stars button.on{color:var(--pin)}
.stars button.on .ic{fill:var(--pin)}
.stars:hover button .ic{fill:var(--pin);stroke:var(--pin)}
.stars:hover button:hover ~ button .ic{fill:none;stroke:var(--faint)}

.field{display:flex;flex-direction:column;gap:6px;margin-bottom:18px;min-width:0}
.label{font-size:.84em;font-weight:650;color:var(--muted)}
.label-row{display:flex;align-items:center;justify-content:space-between;gap:10px}
.field-row{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:18px;align-items:start}
.field-row .stars{height:38px;align-items:center}
textarea.mono{font-family:var(--mono);font-size:.88em;line-height:1.65;min-height:240px}
.body-meta{display:flex;gap:6px 12px;align-items:center;flex-wrap:wrap;font-size:.8em;color:var(--faint);margin-top:2px}
.body-meta .var{font-size:.92em}
.vars-list{display:inline-flex;flex-wrap:wrap;gap:4px 6px;align-items:center}
.help{font-size:.84em;color:var(--muted);margin:-8px 0 20px;line-height:1.55}
.tag-input{display:flex;flex-wrap:wrap;gap:5px;align-items:center;min-height:40px;padding:5px 6px;border:1px solid var(--line);border-radius:8px;background:var(--panel);cursor:text}
.tag-input:focus-within{border-color:var(--focus);box-shadow:0 0 0 3px color-mix(in srgb,var(--focus) 24%,transparent)}
.tag-input input[type="text"]{flex:1;min-width:120px;border:0;padding:3px 4px;background:none;box-shadow:none}
.tag-input input[type="text"]:focus{box-shadow:none}
.history{border-top:1px solid var(--line);padding-top:12px}
.history summary{cursor:pointer;font-weight:650;font-size:.88em;color:var(--muted);padding:4px 0}
.history-list{list-style:none;margin:10px 0 0;padding:0;display:flex;flex-direction:column;gap:10px}
.history-list li{border:1px solid var(--line);border-radius:var(--r);padding:10px 12px;background:var(--panel-2)}
.h-meta{font-size:.8em;color:var(--faint)}
.h-body{font-family:var(--mono);font-size:.78em;white-space:pre-wrap;overflow-wrap:anywhere;margin:6px 0 10px;color:var(--muted);max-height:8.5em;overflow:hidden}

/* Modal */
.modal-wrap{position:fixed;inset:0;z-index:80;display:grid;place-items:center;padding:max(16px,env(safe-area-inset-top,0px)) 16px max(16px,env(safe-area-inset-bottom,0px));background:var(--overlay)}
.modal-wrap[hidden]{display:none}
.modal{background:var(--panel);border:1px solid var(--line);border-radius:var(--r-lg);width:min(440px,100%);max-height:100%;display:flex;flex-direction:column;box-shadow:var(--shadow);min-height:0}
.modal.wide{width:min(700px,100%)}
.modal-head{padding:16px 14px 6px 22px;display:flex;align-items:center;gap:8px;flex:none}
.modal-head h2{font-size:1.14em;font-weight:700;letter-spacing:-.01em;flex:1}
.modal-body{padding:6px 22px 18px;overflow-y:auto;min-height:0}
.modal-text{color:var(--muted);line-height:1.55}
.modal-foot{padding:12px 16px;display:flex;justify-content:flex-end;flex-wrap:wrap;gap:8px;border-top:1px solid var(--line);flex:none}

.settings{display:flex;flex-direction:column;gap:24px}
.set-section h3{font-size:.95em;font-weight:700;margin-bottom:4px}
.set-row{display:grid;grid-template-columns:150px minmax(0,1fr);gap:8px 16px;align-items:center;padding:11px 0;border-top:1px solid var(--line)}
.set-label{font-size:.88em;color:var(--muted);font-weight:600}
.set-row > .seg,.set-row > .swatches,.set-row > .checks,.set-row > .range-row{justify-self:start}
.set-row > .range-row{width:100%}
.set-note{font-size:.86em;color:var(--muted);margin:2px 0 12px;line-height:1.55}
.checks{display:flex;flex-wrap:wrap;gap:8px 18px}
.check{display:inline-flex;align-items:center;gap:8px;font-size:.92em;cursor:pointer}
.check input{width:16px;height:16px;accent-color:var(--accent);margin:0;flex:none}
.radios{flex-wrap:wrap}
.radios label{position:relative;display:inline-flex}
.radios input{position:absolute;inset:0;opacity:0;margin:0;cursor:pointer}
.radios span{display:inline-flex;align-items:center;height:30px;padding:0 11px;border-radius:7px;color:var(--muted);font-weight:600;font-size:.86em}
.radios input:checked + span{background:var(--panel);color:var(--ink);box-shadow:0 0 0 1px var(--line)}
.radios input:focus-visible + span{outline:2px solid var(--focus);outline-offset:1px}
.swatches{display:flex;gap:12px;flex-wrap:wrap;align-items:center}
.swatch{position:relative;display:inline-grid;place-items:center}
.swatch input{position:absolute;inset:0;opacity:0;margin:0;cursor:pointer}
.swatch .sw{width:28px;height:28px;border-radius:50%;box-shadow:inset 0 0 0 1px rgba(0,0,0,.14)}
.swatch input:checked + .sw{box-shadow:0 0 0 2px var(--panel),0 0 0 4px var(--ink)}
.swatch input:focus-visible + .sw{outline:2px solid var(--focus);outline-offset:5px}
.range-row{display:flex;align-items:center;gap:12px}
.range-row input{flex:1;accent-color:var(--accent);max-width:260px}
.range-row output{font-size:.88em;color:var(--muted);min-width:4.5em}
.data-actions{display:flex;flex-wrap:wrap;gap:8px}
.set-row > .pack-row{justify-self:stretch}
.pack-row{display:flex;flex-direction:column;gap:8px;min-width:0}
.pack-about{font-size:.88em;color:var(--muted);line-height:1.5}
.pack-row .data-actions:empty{display:none}
.cat-manage{display:flex;flex-direction:column;gap:6px;margin:14px 0}
.cat-row{display:flex;align-items:center;gap:6px}
.cat-row input[type="color"]{width:36px;height:36px;padding:3px;border:1px solid var(--line);border-radius:8px;background:var(--panel);cursor:pointer;flex:none}
.cat-row input[type="text"]{flex:1;min-width:0}
.cat-row .count{width:2.6em;text-align:right;color:var(--faint);font-size:.84em;font-variant-numeric:tabular-nums;flex:none}
.cat-add-row{display:flex;gap:8px}
.keys{width:100%;border-collapse:collapse}
.keys td{padding:8px 0;border-top:1px solid var(--line);font-size:.92em;vertical-align:top}
.keys tr:first-child td{border-top:0}
.keys td:first-child{width:42%;white-space:nowrap;padding-right:12px}
.keys kbd + kbd{margin-left:3px}

/* Toasts */
.toasts{position:fixed;left:50%;bottom:0;transform:translateX(-50%);padding:0 12px calc(18px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;align-items:center;gap:8px;z-index:90;pointer-events:none;width:max-content;max-width:100%}
.toast{pointer-events:auto;background:var(--ink);color:var(--bg);padding:10px 12px 10px 16px;border-radius:12px;display:flex;gap:14px;align-items:center;font-size:.9em;max-width:min(540px,94vw);box-shadow:var(--shadow);animation:toast-in .2s ease-out}
.toast.toast-warn{background:var(--danger);color:#fff}
.toast.out{opacity:0;transform:translateY(6px);transition:opacity .16s,transform .16s}
.toast-btn{border:0;background:none;color:inherit;font-weight:700;text-decoration:underline;text-underline-offset:3px;padding:4px;flex:none}
@keyframes toast-in{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}

/* Narrow screens */
@media (max-width: 880px){
  .app{grid-template-columns:minmax(0,1fr)}
  .sidebar{position:fixed;top:0;bottom:0;left:0;width:min(300px,86vw);z-index:65;transform:translateX(-102%);visibility:hidden;transition:transform .22s cubic-bezier(.2,.8,.2,1),visibility 0s linear .22s;padding-top:calc(18px + env(safe-area-inset-top,0px));padding-bottom:calc(14px + env(safe-area-inset-bottom,0px));box-shadow:var(--shadow)}
  .app[data-sidebar="open"] .sidebar{transform:none;visibility:visible;transition:transform .22s cubic-bezier(.2,.8,.2,1),visibility 0s}
  .menu-btn,.close-side{display:inline-grid}
  .toolbar{padding:10px 14px}
  .content{padding:12px 14px 48px}
  .filterbar .hint{display:none}
}
@media (max-width: 640px){
  .search{order:-1;flex-basis:calc(100% - 46px);max-width:none}
  .menu-btn{order:-2}
  .search kbd,.hide-sm{display:none}
  .toolbar .spacer{display:none}
  .new-label{display:none}
  #newBtn{width:38px;padding:0;margin-left:auto}
  .toolbar{gap:6px}
  .tb-group select.control{max-width:140px}
  #viewSeg > button.icon-only{width:30px}
  .cards.as-cards{grid-template-columns:minmax(0,1fr)}
  .cards.as-list .card{grid-template-columns:minmax(0,1fr) auto;grid-template-areas:"head head" "title title" "preview preview" "tags foot";row-gap:4px}
  .as-list .card-stat{display:none}
  .drawer-body{padding:18px 16px 24px}
  .fill-field{grid-template-columns:minmax(0,1fr);gap:6px}
  .fill-field > .var{margin-top:0}
  .field-row{grid-template-columns:minmax(0,1fr);gap:0}
  .set-row{grid-template-columns:minmax(0,1fr)}
  .d-title{font-size:1.4em}
}
@media (prefers-reduced-motion: reduce){
  *,*::before,*::after{transition-duration:0s!important;animation:none!important}
}

/* ---------- Research library additions ---------- */
:root{--serif:"Iowan Old Style","Charter","Palatino Linotype","Book Antiqua",Georgia,"Times New Roman",serif}
.group-wrap select.control{max-width:160px}
.toolbar .search{flex:1 1 200px;min-width:160px}
#list{min-height:40vh}
.group{margin-bottom:22px}
.group-head{display:flex;align-items:center;gap:9px;width:100%;border:0;background:none;padding:6px 2px 10px;color:var(--ink);font-size:.95em;font-weight:700;text-align:left}
.group-head .dot{width:11px;height:11px;border-radius:3px;background:var(--c);flex:none}
.group-head .count{color:var(--faint);font-weight:500;font-size:.88em;font-variant-numeric:tabular-nums}
.group-head .ic{width:16px;height:16px;color:var(--muted);transition:transform .15s}
.group.closed .group-head .ic{transform:rotate(-90deg)}
.group-head:hover .group-name{text-decoration:underline;text-underline-offset:3px}

.kind-tag{display:inline-grid;place-items:center;width:22px;height:22px;border-radius:6px;background:var(--panel-2);color:var(--muted);flex:none}
.kind-tag .ic{width:14px;height:14px}
.kind-doc .kind-tag{background:color-mix(in srgb,var(--cat) 16%,var(--panel));color:var(--ink)}
.plat-pill{display:inline-flex;align-items:center;gap:6px;height:22px;padding:0 8px 0 7px;border-radius:999px;font-size:.76em;font-weight:650;color:var(--ink);background:color-mix(in srgb,var(--c) 15%,var(--panel));border:1px solid color-mix(in srgb,var(--c) 45%,transparent);white-space:nowrap;flex:none}
.plat-pill::before{content:"";width:7px;height:7px;border-radius:50%;background:var(--c)}
.status-pill{display:inline-flex;align-items:center;height:20px;padding:0 7px;border-radius:5px;font-size:.72em;font-weight:650;white-space:nowrap;flex:none;color:var(--muted);background:var(--panel-2);border:1px solid var(--line)}
.status-pill.s-unread{color:var(--accent-ink);background:var(--accent);border-color:var(--accent)}
.status-pill.s-reading{color:var(--ink);background:color-mix(in srgb,var(--hl) 55%,var(--panel));border-color:transparent}
.status-pill.s-archived{opacity:.7}
.card-proj{font-size:.76em;font-weight:600;color:var(--muted);min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.card.kind-doc.s-unread .card-title{font-weight:750}
.card.s-archived{opacity:.72}
.card-preview.mono{font-family:var(--mono);font-size:.8em}
.card-preview.prose-preview{font-family:var(--ui);font-size:.86em;line-height:1.55;white-space:normal}
:root[data-read="serif"] .card-preview.prose-preview{font-family:var(--serif);font-size:.92em}
.card-runs{display:flex;flex-wrap:wrap;gap:5px}
.run-chip{display:inline-flex;align-items:center;gap:5px;height:22px;padding:0 8px;border-radius:999px;border:1px solid var(--line);font-size:.75em;font-weight:600;color:var(--muted);font-variant-numeric:tabular-nums}
.pdot{width:7px;height:7px;border-radius:50%;background:var(--c);flex:none}
.card-link{display:flex;align-items:center;gap:6px;font-size:.78em;color:var(--muted);min-width:0}
.card-link span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.card-link .ic{width:14px;height:14px}
.as-list .card-head .plat-pill,.as-list .card-head .status-pill{height:20px}
.as-list .card-runs,.as-list .card-link{display:none}

.drawer.wide{width:min(900px,100%)}
.tab-n{font-size:.82em;color:var(--faint);font-variant-numeric:tabular-nums}
.d-model{font-size:.82em;color:var(--muted);font-weight:600}
.d-help{font-size:.86em;color:var(--muted);margin:-4px 0 10px;line-height:1.5}
.field-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:0 16px;align-items:start}
.field-grid .stars{height:38px;align-items:center}
.date-input{width:100%;height:38px;border:1px solid var(--line);background:var(--panel);border-radius:8px;padding:0 10px;font-size:.92em}
.date-input:focus,input[type="text"].plain:focus{outline:none;border-color:var(--focus);box-shadow:0 0 0 3px color-mix(in srgb,var(--focus) 24%,transparent)}
textarea.doc-input{min-height:320px}
.copy-foot{gap:6px}
.copy-for{display:flex;flex-wrap:wrap;gap:6px}
.plat-btn .pdot{width:8px;height:8px}
.plat-btn:hover:not(:disabled){border-color:var(--c)}
.plat-btn.copied .pdot{background:#fff}
.coverage{display:flex;flex-wrap:wrap;gap:6px;margin-top:12px}
.cov{display:inline-flex;align-items:center;gap:7px;height:30px;padding:0 10px;border-radius:8px;border:1px dashed var(--line-strong);font-size:.85em;color:var(--muted)}
.cov.on{border-style:solid;border-color:color-mix(in srgb,var(--c) 50%,transparent);background:color-mix(in srgb,var(--c) 10%,var(--panel));color:var(--ink)}
.cov .count{font-variant-numeric:tabular-nums;font-weight:650}
.add-result{display:flex;flex-wrap:wrap;gap:6px}
.run-list{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:6px}
.run-row{display:grid;grid-template-columns:auto minmax(0,1fr) auto;grid-template-areas:"pill title status" "pill meta status";gap:2px 10px;align-items:center;width:100%;text-align:left;padding:9px 12px;border:1px solid var(--line);border-left:4px solid var(--c);border-radius:var(--r);background:var(--panel)}
.run-row:hover{border-color:var(--line-strong);border-left-color:var(--c)}
.run-row .plat-pill{grid-area:pill}
.run-title{grid-area:title;font-weight:650;font-size:.93em;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.run-meta{grid-area:meta;font-size:.8em;color:var(--muted)}
.run-row .status-pill{grid-area:status}

.status-row{margin-top:12px}
.status-row .seg{flex-wrap:wrap}
.d-links{display:flex;flex-wrap:wrap;gap:6px 16px;margin-top:12px}
.link-btn{display:inline-flex;align-items:center;gap:6px;border:0;background:none;padding:2px 0;color:var(--ink);font-size:.88em;font-weight:600;text-decoration:underline;text-decoration-color:var(--line-strong);text-underline-offset:3px;max-width:100%}
.link-btn span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.link-btn .ic{width:16px;height:16px;color:var(--muted)}
.link-btn:hover{text-decoration-color:currentColor}
.summary-box{margin-top:20px;padding:14px 16px;border-radius:var(--r);background:color-mix(in srgb,var(--hl) 22%,var(--panel));border:1px solid color-mix(in srgb,var(--hl) 60%,var(--line))}
.summary-box h3{font-size:.82em;font-weight:700;margin-bottom:6px}
.summary-box .prose p:last-child{margin-bottom:0}
.doc-tools{position:sticky;top:-22px;z-index:2;background:var(--panel);margin:22px -24px 0;padding:10px 24px;border-bottom:1px solid var(--line);display:flex;flex-wrap:wrap;gap:8px 14px;align-items:center}
.find{position:relative;display:flex;align-items:center;gap:4px;flex:1 1 260px;min-width:200px;max-width:420px}
.find > .ic{position:absolute;left:10px;top:50%;transform:translateY(-50%);color:var(--faint);width:16px;height:16px;pointer-events:none}
.find input{height:34px;padding:0 10px 0 32px;font-size:.88em}
.find-count{font-size:.78em;color:var(--muted);white-space:nowrap;min-width:4.5em;text-align:right}
.outline{font-size:.88em}
.outline summary{cursor:pointer;font-weight:650;color:var(--muted);padding:4px 0}
.outline ol{list-style:none;margin:6px 0 0;padding:8px 0;max-height:280px;overflow:auto;position:absolute;background:var(--panel);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow);min-width:260px;max-width:min(420px,80vw);z-index:5}
.outline li button{display:block;width:100%;text-align:left;border:0;background:none;padding:5px 14px;font-size:.92em;color:var(--ink);line-height:1.35}
.outline li button:hover{background:var(--sunk)}
.outline li.lv2 button{padding-left:26px}
.outline li.lv3 button{padding-left:38px;color:var(--muted)}
mark.current{background:var(--hl);color:var(--hl-ink);box-shadow:0 0 0 2px var(--hl)}
.empty-doc{margin-top:24px;padding:24px;border:1px dashed var(--line-strong);border-radius:var(--r);color:var(--muted);display:flex;flex-direction:column;gap:12px;align-items:flex-start}
.sources{margin-top:28px;border-top:1px solid var(--line);padding-top:14px;font-size:.9em}
.sources summary{cursor:pointer;font-weight:650}
.domains{display:flex;flex-wrap:wrap;gap:5px;margin:12px 0}
.dom{display:inline-flex;align-items:center;gap:6px;height:24px;padding:0 8px;border-radius:999px;border:1px solid var(--line);font-size:.82em;color:var(--muted)}
.src-list{margin:0;padding-left:1.6em;font-size:.86em;line-height:1.7;overflow-wrap:anywhere}
.src-list a{color:var(--muted)}

/* Reading typography */
.prose{line-height:1.7;color:var(--ink);overflow-wrap:break-word}
.doc-body{font-size:1.02em;max-width:72ch;margin-top:18px}
:root[data-read="serif"] .doc-body,:root[data-read="serif"] .summary-box .prose{font-family:var(--serif);font-size:1.08em}
.prose h1,.prose h2,.prose h3,.prose h4,.prose h5,.prose h6{font-family:var(--ui);line-height:1.25;letter-spacing:-.012em;margin:1.6em 0 .55em;scroll-margin-top:70px}
.prose h1{font-size:1.5em;font-weight:750}
.prose h2{font-size:1.25em;font-weight:720;padding-bottom:.25em;border-bottom:1px solid var(--line)}
.prose h3{font-size:1.06em;font-weight:700}
.prose h4,.prose h5,.prose h6{font-size:.95em;font-weight:700;color:var(--muted)}
.prose > :first-child{margin-top:0}
.prose p{margin:0 0 .95em}
.prose ul,.prose ol{margin:0 0 1em;padding-left:1.5em}
.prose li{margin:.25em 0}
.prose li > ul,.prose li > ol{margin:.25em 0}
.prose a{color:var(--ink);text-decoration-color:color-mix(in srgb,var(--focus) 60%,transparent);text-underline-offset:2px;overflow-wrap:anywhere}
.prose a:hover{text-decoration-color:currentColor}
.prose blockquote{margin:0 0 1em;padding:.2em 0 .2em 1em;border-left:3px solid var(--line-strong);color:var(--muted)}
.prose hr{border:0;border-top:1px solid var(--line);margin:1.6em 0}
.prose code{font-size:.86em}
.prose pre{background:var(--panel-2);border:1px solid var(--line);border-radius:8px;padding:12px 14px;overflow-x:auto;font-size:.84em;line-height:1.55;margin:0 0 1em}
.prose pre code{background:none;padding:0;font-size:1em}
.prose strong{font-weight:700}
.table-wrap{overflow-x:auto;margin:0 0 1.1em;border:1px solid var(--line);border-radius:8px}
.prose table,.cmp-stats table{border-collapse:collapse;width:100%;font-family:var(--ui);font-size:.86em;line-height:1.45}
.prose th,.prose td{padding:8px 12px;border-bottom:1px solid var(--line);text-align:left;vertical-align:top}
.prose thead th{background:var(--panel-2);font-weight:700;white-space:nowrap}
.prose tbody tr:last-child td{border-bottom:0}
.task{font-family:var(--ui)}

/* Compare */
.compare{position:fixed;inset:0;z-index:70;background:var(--bg);padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
.compare[hidden]{display:none}
.cmp{height:100%;display:flex;flex-direction:column;min-height:0}
.cmp-head{display:flex;flex-wrap:wrap;align-items:center;gap:10px 14px;padding:12px 18px;border-bottom:1px solid var(--line);background:var(--panel)}
.cmp-title{flex:1 1 220px;min-width:0}
.cmp-title h2{font-size:1.1em;font-weight:700}
.cmp-title p{font-size:.86em;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.cmp-head .find{flex:0 1 300px}
.cmp-stats{margin:12px 18px 0;background:var(--panel);flex:none}
.cmp-stats th,.cmp-stats td{padding:7px 12px;border-bottom:1px solid var(--line);text-align:left;white-space:nowrap}
.cmp-stats tbody tr:last-child th,.cmp-stats tbody tr:last-child td{border-bottom:0}
.cmp-stats tbody th{color:var(--muted);font-weight:600;width:1%}
.cmp-stats td.best{font-weight:750}
.cmp-stats td.best::after{content:" ●";color:var(--ok);font-size:.7em;vertical-align:middle}
.cmp-stats .stars button{width:24px;height:24px}
.cmp-cols{flex:1;min-height:0;display:grid;grid-template-columns:repeat(var(--n),minmax(300px,1fr));gap:12px;padding:12px 18px;overflow-x:auto}
.cmp-col{display:flex;flex-direction:column;min-height:0;background:var(--panel);border:1px solid var(--line);border-radius:var(--r)}
.cmp-col-head{display:flex;align-items:center;gap:8px;padding:10px 14px;border-bottom:1px solid var(--line)}
.cmp-col-head h3{flex:1;min-width:0;font-size:.92em;font-weight:700;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.cmp-body{flex:1;min-height:0;overflow-y:auto;padding:14px 18px 40px;margin:0;max-width:none;font-size:.95em}
.cmp-foot{padding:10px 18px 14px;border-top:1px solid var(--line);background:var(--panel);display:flex;flex-direction:column;gap:6px}
.cmp-foot textarea{min-height:44px}

/* Managers */
.manage{display:flex;flex-direction:column;gap:8px;margin:14px 0}
.mg-row{display:flex;flex-direction:column;gap:8px}
.mg-row.plat{border:1px solid var(--line);border-radius:var(--r);padding:10px 12px;background:var(--panel-2)}
.mg-row.plat .field{margin-bottom:0}
.mg-line{display:flex;align-items:center;gap:6px}
.mg-line input[type="color"]{width:36px;height:36px;padding:3px;border:1px solid var(--line);border-radius:8px;background:var(--panel);cursor:pointer;flex:none}
.mg-line input[type="text"]{flex:1;min-width:0}
.mg-line .count{width:2.6em;text-align:right;color:var(--faint);font-size:.84em;font-variant-numeric:tabular-nums;flex:none}
.add-row{padding:4px 4px 2px}
.add-row input{height:34px;padding:0 10px}

@media (max-width: 880px){ .doc-tools{margin:18px -16px 0;padding:10px 16px} }
@media (max-width: 640px){
  .field-grid{grid-template-columns:minmax(0,1fr)}
  .toolbar{gap:6px}
  .menu-btn{order:-4}
  .toolbar .search{order:-3;flex:1 1 calc(100% - 136px);min-width:0;max-width:none}
  #newDocBtn,#newPromptBtn{order:-2;width:38px;padding:0;margin-left:0}
  .tb-group{order:1;flex:1 1 48%;min-width:0}
  .group-wrap{order:1;flex:1 1 30%;min-width:0}
  #selectBtn{order:1}
  .tb-group .select-wrap{flex:1 1 0;min-width:0}
  .tb-group select.control,.group-wrap select.control{width:100%;max-width:none}
  #viewSeg,.toolbar .spacer{display:none}
  .cmp-cols{grid-template-columns:repeat(var(--n),86vw);scroll-snap-type:x mandatory;padding:10px 12px}
  .cmp-col{scroll-snap-align:start}
  .cmp-head{padding:10px 12px}
  .cmp-stats{margin:10px 12px 0}
  .run-row{grid-template-columns:minmax(0,1fr) auto;grid-template-areas:"pill status" "title title" "meta meta"}
  .run-row .plat-pill{justify-self:start}
}

      if (confirmed) this.settle();
      return;
    }
    const m = snap.data() || {};
    const ts = +m.updatedAt || 0;
    if (ts > state.updatedAt) { const ok = await this.pull(m, ts); if (ok && confirmed) this.settle(); }
    else if (ts < state.updatedAt) { this.knownFrom(m); this.schedule(400); if (confirmed) this.settle(); }
    else { this.knownFrom(m); if (!this.busy && !this.timer && (confirmed || this.state === 'connecting')) this.set('synced'); if (confirmed) this.settle(); }
  },
  async pull(m, ts) {
    if (!this.ref) return false;
    try {
      const col = this.ref.collection('chunks');
      const local = new Map(state.items.map(it => [it.id, it]));
      const items = [], need = [];
      for (const [id, ids] of Object.entries(m.items || {})) {
        const have = local.get(id);
        if (have && itemChunks(have).ids.join(',') === ids.join(',')) items.push(have);
        else need.push([id, ids.map(String)]);
      }
      const got = new Map();
      let missing = false;
      await pool([...new Set(need.flatMap(x => x[1]))], 4, async cid => {
        const s = await col.doc(cid).get();
        if (!s.exists) { missing = true; return; }
        got.set(cid, String((s.data() || {}).s || ''));
      });
      if (missing) return false; // another device is mid-save; its next update completes this
      for (const [, ids] of need) items.push(JSON.parse(ids.map(c => got.get(c)).join('')));
      const remote = normalize(Object.assign({}, m.core || {}, { items, updatedAt: ts }));
      if (state.updatedAt > ts) { this.schedule(400); return true; }
      if (state.updatedAt === ts) { this.knownFrom(m); return true; }
      const hadWork = state.updatedAt > 0;
      remote.updatedAt = ts; remote.seeded = false;
      state = remote;
      this.knownFrom(m);
      persist(); render(); refreshOpenViews();
      this.set('synced');
      if (hadWork) toast('Your library was updated from another device.');
      return true;
    } catch (e) {
      if (e && e.code === 'unavailable' && !this.pullRetried) {
        this.pullRetried = true;
        setTimeout(() => { this.pull(m, ts).then(ok => { if (ok) this.settle(); }); }, 1500 + Math.random() * 1500);
        return false;
      }
      this.ref = null; // stop rather than risk overwriting an account copy we couldn't read
      this.set('error', e && e.code);
      this.settle();
      return false;
    }
  },
  schedule(delay) {
    if (!this.ref) return;
    clearTimeout(this.timer);
    if (this.state !== 'saving') this.set('pending');
    this.timer = setTimeout(() => { this.timer = null; this.push(); }, delay == null ? 1500 : delay);
  },
  async push() {
    if (!this.ref) return;
    if (this.busy) { this.again = true; return; }
    this.busy = true; this.set('saving');
    let retry = false;
    try {
      const ts = state.updatedAt;
      const col = this.ref.collection('chunks');
      const map = {}, write = new Map();
      for (const it of state.items) {
        const { pieces, ids } = itemChunks(it);
        map[it.id] = ids;
        ids.forEach((cid, k) => { if (!this.known.has(cid) && !write.has(cid)) write.set(cid, pieces[k]); });
      }
      await pool([...write.keys()], 3, async cid => { await col.doc(cid).set({ s: write.get(cid) }); this.known.add(cid); });
      const core = { settings: state.settings, platforms: state.platforms, projects: state.projects, packs: state.packs };
      const meta = { v: 1, updatedAt: ts, core, items: map, savedAt: Date.now() };
      if (new TextEncoder().encode(JSON.stringify(meta)).length > 250000) throw { code: 'too_large' };
      await this.ref.set(meta);
      const now = new Set(Object.values(map).flat());
      const stale = [...this.known].filter(x => !now.has(x));
      this.known = now; this.retries = 0;
      await pool(stale, 3, async cid => { try { await col.doc(cid).delete(); } catch (e) { /* harmless leftover */ } });
      if (!this.again && !this.timer) this.set('synced');
    } catch (e) {
      const code = e && e.code;
      if (code === 'unavailable' && this.retries < 2) { this.retries++; retry = true; }
      else this.set('error', code);
    } finally {
      this.busy = false;
      if (retry) this.schedule(1500 + Math.random() * 2000);
      else if (this.again) { this.again = false; this.schedule(300); }
    }
  }
};
function syncLabel() {
  switch (Sync.state) {
    case 'connecting': return 'Connecting to your account…';
    case 'pending': case 'saving': return 'Saving to your account…';
    case 'synced': return 'Saved to your account';
    case 'offline': return 'Can’t reach your account yet. Changes are kept in this browser.';
    case 'error':
      if (Sync.detail === 'quota_exceeded') return 'Account storage is full. Changes are kept in this browser.';
      if (Sync.detail === 'too_large') return 'Too many items to sync to your account. Changes are kept in this browser.';
      return 'Account sync paused. Changes are kept in this browser.';
    default: return storeOK ? 'Saved in this browser' : 'This browser isn’t saving. Export a backup to keep your work.';
  }
}
function updateSyncLabel() {
  const el = document.querySelector('.sync');
  if (el) { el.dataset.state = Sync.state === 'local' && !storeOK ? 'blocked' : Sync.state; const t = el.querySelector('.sync-text'); if (t) t.textContent = syncLabel(); }
  const n = document.getElementById('syncNote');
  if (n) n.textContent = syncLabel();
}

let modalResolve = null, modalRet = null, modalActions = [];
function openModal(o) {

    modalResolve = res;
    modalRet = document.activeElement;
    modalActions = o.actions || [];

      <div class="modal-body">${o.body || ''}</div>

    </div>`;
    modalWrap.hidden = false;
    app.inert = true; drawer.inert = true; cmpEl.inert = true;

    if (o.onMount) o.onMount(m);
    const f = $('[autofocus]', m) || $('.modal-foot .btn.primary, .modal-foot .btn.danger-solid', m) || $('.modal-body button, .modal-body input, .modal-body select', m) || $('[data-mact="close"]', m);

function closeModal(val) {

  app.inert = !!ui.drawer || !!ui.compare;
  const r = modalResolve, ret = modalRet;
  modalResolve = null; modalRet = null;
  if (ret && ret.isConnected && ret.focus) ret.focus({ preventScroll: true });

}
modalWrap.addEventListener('click', e => {

async function dataAction(act) {

  if (act.startsWith('pack-add:')) { closeModal(null); addPack(act.slice(9)); return; }

function openManager(type) {
  const isPlat = type === 'platform';
  openModal({
    title: isPlat ? 'Platforms' : 'Projects', wide: isPlat,
    body: `<p class="modal-text">${isPlat ? 'Rename, recolor, and reorder platforms, set the link that opens after copying, and add instructions to include whenever you copy a prompt for that platform. Removing one keeps its items.' : 'Rename, recolor, and reorder projects. Removing one keeps its prompts and documents.'}</p>

    actions: [{ label: 'Done', kind: 'primary', value: true }],
    onMount(m) {
      renderManageRows(m);

      const addFrom = () => { const inp = $('#newName', m); const c = addNamed(type, inp.value); if (c) { inp.value = ''; renderManageRows(m); inp.focus(); } };
      const find = el => { const r = el.closest('[data-rid]'); return r ? list().find(x => x.id === r.dataset.rid) : null; };

      });

      });

        const arr = list(), c = find(b);
        if (!c) return;

        if (b.dataset.mg === 'up' || b.dataset.mg === 'down') {
          const j = b.dataset.mg === 'up' ? i - 1 : i + 1;
          if (j < 0 || j >= arr.length) return;
          [arr[i], arr[j]] = [arr[j], arr[i]];
          commit(); renderManageRows(m);
          const nb = $(`[data-rid="${cssId(c.id)}"] [data-mg="${b.dataset.mg}"]`, m);
          (nb && !nb.disabled ? nb : $(`[data-rid="${cssId(c.id)}"] [data-mg="name"]`, m)).focus();
        } else if (b.dataset.mg === 'del') {
          snapshot(`removing “${c.name}”`);
          const field = isPlat ? 'platform' : 'projectId';
          state.items.forEach(x => { if (x[field] === c.id) x[field] = null; });
          arr.splice(i, 1);

          const next = $$('[data-mg="name"]', m)[Math.min(i, arr.length - 1)];
          (next || $('#newName', m)).focus();

function exportOrder(list) {

  return [...list].sort((a, b) => (a.kind === b.kind ? 0 : a.kind === 'prompt' ? -1 : 1) || ((ji.has(a.projectId) ? ji.get(a.projectId) : 1e6) - (ji.has(b.projectId) ? ji.get(b.projectId) : 1e6)) || runTime(b) - runTime(a));
}
function exportJSON(items) {

    const v = s.value === '__none' ? null : s.value;
    if (act === 'project' || act === 'platform') assign([...ui.selected], act, v);
    else if (act === 'status') setStatus([...ui.selected], s.value);
  });

  /* List */
  listEl.addEventListener('click', e => {
    const gh = e.target.closest('.group-head');
    if (gh) { const k = gh.dataset.gkey; ui.collapsed.has(k) ? ui.collapsed.delete(k) : ui.collapsed.add(k); renderList(); return; }
    const ea = e.target.closest('[data-eact]');
    if (ea) {
      const a = ea.dataset.eact;
      if (a === 'new-prompt') openNew('prompt');
      else if (a === 'new-doc') openNew('doc', { focus: 'fBody' });
      else if (a === 'new-from-q') { const q = ui.q.trim(); clearFilters(); openNew('prompt', { title: q }); }
      else if (a === 'import') fileInput.click();
      else if (a.startsWith('pack:')) addPack(a.slice(5));
      else if (a === 'clear') clearFilters();
      return;
    }
    const card = e.target.closest('.card');
    if (!card) return;
    const it = getItem(card.dataset.id);
    if (!it) return;
    const actEl = e.target.closest('[data-act]');
    if (actEl && card.contains(actEl)) {
      const act = actEl.dataset.act;
      if (act === 'pin') togglePin(it);
      else if (act === 'edit') openItem(it.id, 'edit');
      else if (act === 'quick') quickUse(it);
      else if (act === 'read') openItem(it.id, 'read');
      else if (act === 'tag') toggleTag(actEl.dataset.tag);
      return;
    }
    if (window.getSelection && String(window.getSelection()).length > 2) return;
    if (ui.selectMode) toggleSelect(it.id, e.shiftKey);
    else openItem(it.id);
  });
  listEl.addEventListener('keydown', e => {
    const card = e.target.closest('.card');
    if (!card || e.target !== card || e.ctrlKey || e.metaKey || e.altKey) return;
    const it = getItem(card.dataset.id);
    if (!it) return;
    const k = e.key;
    let handled = true;
    if (k === 'Enter' || k === ' ') { ui.selectMode ? toggleSelect(it.id, e.shiftKey) : openItem(it.id); }
    else if (k === 'e' || k === 'E') openItem(it.id, 'edit');
    else if ((k === 'c' || k === 'C') && it.kind === 'prompt') quickUse(it);
    else if ((k === 'r' || k === 'R') && it.kind === 'doc') { setStatus([it.id], it.status === 'reviewed' ? 'unread' : 'reviewed'); toast(`Marked as ${it.status === 'reviewed' ? 'reviewed' : 'unread'}.`); }
    else if (k === 'p' || k === 'P') togglePin(it);
    else if (k === 'd' || k === 'D') duplicate(it);
    else if (k === 'Delete' || k === 'Backspace') deleteItems([it.id]);
    else if (k.startsWith('Arrow')) {
      const cards = $$('.card', listEl), i = cards.indexOf(card);
      let step = 1;
      if ((k === 'ArrowUp' || k === 'ArrowDown') && state.settings.view === 'cards') step = getComputedStyle(card.parentElement).gridTemplateColumns.split(' ').filter(Boolean).length || 1;
      const t = cards[clamp(i + ((k === 'ArrowRight' || k === 'ArrowDown') ? step : -step), 0, cards.length - 1)];
      if (t) t.focus();
    } else handled = false;
    if (handled) e.preventDefault();
  });

  /* Drag and drop */
  let dragId = null;
  const clearDrop = () => $$('.drop-target').forEach(x => x.classList.remove('drop-target'));
  listEl.addEventListener('dragstart', e => {
    const card = e.target.closest && e.target.closest('.card');
    if (!card) return;
    const it = getItem(card.dataset.id);
    dragId = card.dataset.id;
    e.dataTransfer.effectAllowed = 'copyMove';
    e.dataTransfer.setData('text/x-item-id', dragId);
    if (it) e.dataTransfer.setData('text/plain', it.body);
    card.classList.add('dragging');
  });
  listEl.addEventListener('dragend', () => { $$('.dragging').forEach(x => x.classList.remove('dragging')); clearDrop(); dragId = null; });
  listEl.addEventListener('dragover', e => {
    if (!dragId || state.settings.sort !== 'custom') return;
    const card = e.target.closest('.card');
    if (!card || card.dataset.id === dragId) return;
    e.preventDefault();
    e.dataTransfer.dropEffect = 'move';
    if (!card.classList.contains('drop-target')) { clearDrop(); card.classList.add('drop-target'); }
  });
  listEl.addEventListener('drop', e => {
    if (!dragId || state.settings.sort !== 'custom') return;
    const card = e.target.closest('.card');
    if (!card || card.dataset.id === dragId) return;
    e.preventDefault(); e.stopPropagation();
    const id = dragId;
    clearDrop();
    reorder(id, card.dataset.id);
    const moved = $(`.card[data-id="${cssId(id)}"]`, listEl); if (moved) moved.focus({ preventScroll: true });
  });
  sidebar.addEventListener('dragover', e => {
    if (!dragId) return;
    const t = e.target.closest('[data-drop]');
    if (!t) return;
    e.preventDefault();
    e.dataTransfer.dropEffect = 'move';
    if (!t.classList.contains('drop-target')) { clearDrop(); t.classList.add('drop-target'); }
  });
  sidebar.addEventListener('dragleave', e => { const t = e.target.closest && e.target.closest('[data-drop]'); if (t && !t.contains(e.relatedTarget)) t.classList.remove('drop-target'); });
  sidebar.addEventListener('drop', e => {
    if (!dragId) return;
    const t = e.target.closest('[data-drop]');
    if (!t) return;
    e.preventDefault(); e.stopPropagation();
    const ids = ui.selectMode && ui.selected.has(dragId) ? [...ui.selected] : [dragId];
    clearDrop();
    const [field, val] = t.dataset.drop.split(':');
    if (field === 'status') setStatus(ids, val);
    else assign(ids, field, val || null);
  });
  window.addEventListener('dragover', e => { if (!dragId && e.dataTransfer && Array.from(e.dataTransfer.types || []).includes('Files')) e.preventDefault(); });
  window.addEventListener('drop', e => {
    if (dragId || !e.dataTransfer || !e.dataTransfer.files || !e.dataTransfer.files.length) return;
    e.preventDefault();
    if (!modalWrap.hidden || ui.drawer || ui.compare) return;
    handleFiles(e.dataTransfer.files);
  });
  fileInput.addEventListener('change', () => { const fs = Array.from(fileInput.files || []); fileInput.value = ''; handleFiles(fs); });
  docFileInput.addEventListener('change', async () => {
    const f = docFileInput.files && docFileInput.files[0];
    docFileInput.value = '';
    if (!f || !ui.drawer || ui.drawer.mode !== 'edit') return;
    try {
      const d = await fileToDoc(f), dr = ui.drawer.draft;
      dr.body = d.body; if (!dr.title.trim()) dr.title = d.title; if (!dr.platform && d.platform) dr.platform = d.platform;
      ui.drawer.dirty = true;
      renderDrawer();
      toast(`Loaded ${f.name}.`);
    } catch (e) { toast('That file couldn’t be read.', { kind: 'warn' }); }
  });

  /* Paste a report anywhere to start a document */
  document.addEventListener('paste', e => {
    const t = e.target;
    const typing = t && (/^(INPUT|TEXTAREA|SELECT)$/.test(t.tagName) || t.isContentEditable);
    if (typing || ui.drawer || ui.compare || !modalWrap.hidden || !e.clipboardData) return;
    const html = e.clipboardData.getData('text/html'), text = e.clipboardData.getData('text/plain');
    const body = html && looksStructuredHtml(html) ? htmlToMd(html) : (text || '').replace(/\r\n?/g, '\n');
    if (!body || body.trim().length < 40) return;
    e.preventDefault();
    openNew('doc', { body, focus: 'fPlatform' });
    toast('Started a document from your clipboard. Pick where it came from, then save.');
  });

  /* Drawer */
  drawer.addEventListener('click', e => {
    const d = ui.drawer;
    if (!d) return;
    const star = e.target.closest('[data-rate]');
    if (star) {
      const ctx = star.closest('.stars').dataset.ctx, n = +star.dataset.rate;
      if (ctx === 'use') { const it = getItem(d.id); if (!it) return; it.rating = it.rating === n ? 0 : n; commit(); star.closest('.stars').outerHTML = starsHTML(it.rating, 'use'); }
      else { d.draft.rating = d.draft.rating === n ? 0 : n; d.dirty = true; star.closest('.stars').outerHTML = starsHTML(d.draft.rating, 'edit'); }
      const nb = $(`.stars [data-rate="${n}"]`, drawer); if (nb) nb.focus();
      return;
    }
    if (e.target.id === 'tagBox') { $('#fTagInput', drawer).focus(); return; }
    const b = e.target.closest('[data-dact]');
    if (!b) return;
    const it = d.id ? getItem(d.id) : null;
    switch (b.dataset.dact) {
      case 'close': requestCloseDrawer(); break;
      case 'mode': switchMode(b.dataset.mode); break;
      case 'pin': if (it) { it.pinned = !it.pinned; commit(); renderDrawer(); const pb = $('[data-dact="pin"]', drawer); if (pb) pb.focus(); } break;
      case 'duplicate': if (it) duplicate(it); break;
      case 'delete': if (it) deleteItems([it.id]); break;
      case 'copy': copyPrompt(null); break;
      case 'copy-for': copyPrompt(b.dataset.pid); break;
      case 'clear-vars': d.values = {}; renderDrawer(); focusDrawer(); break;
      case 'save': saveDraft(); break;
      case 'cancel': cancelEdit(); break;
      case 'insert-var': insertVar(); break;
      case 'load-file': docFileInput.click(); break;
      case 'rm-tag': d.draft.tags = d.draft.tags.filter(t => t !== b.dataset.tag); d.dirty = true; updateTagBox(); $('#fTagInput', drawer).focus(); break;
      case 'restore': if (it) {
        const h = it.history[+b.dataset.idx];
        if (!h) break;
        const ta = $('#fBody', drawer);
        d.draft.body = h.body; d.dirty = true;
        if (ta) { ta.value = h.body; ta.focus(); ta.setSelectionRange(0, 0); ta.scrollTop = 0; }
        updateBodyMeta();
        toast('That version is in the editor. Save changes to keep it.');
      } break;
      case 'add-result': if (it) {
        const pl = platMap().get(b.dataset.pid);
        openNew('doc', { promptId: it.id, platform: pl ? pl.id : null, projectId: it.projectId, tags: [...it.tags], title: `${it.title}${pl ? ' (' + pl.name + ')' : ''}`, focus: 'fBody' });
      } break;
      case 'open-doc': openItem(b.dataset.did, 'read'); break;
      case 'open-prompt': openItem(b.dataset.pid, 'runs'); break;
      case 'compare': if (it) openCompare(runsFor(it.id).slice(0, 4).map(x => x.id), it.id); break;
      case 'compare-siblings': if (it && it.promptId) openCompare([it.id, ...runsFor(it.promptId).filter(x => x.id !== it.id).slice(0, 3).map(x => x.id)], it.promptId); break;
      case 'status': if (it) { it.status = b.dataset.st; commit(); renderDrawer(); const sb = $(`[data-dact="status"][data-st="${b.dataset.st}"]`, drawer); if (sb) sb.focus(); } break;
      case 'copy-md': if (it) copyText(docToMd(it)).then(ok => toast(ok ? 'Copied the document as Markdown.' : 'The clipboard isn’t available here.', ok ? undefined : { kind: 'warn' })); break;
      case 'download-md': if (it) saveFile(safeFileName(it.title) + '.md', docToMd(it)); break;
      case 'goto': { const t = $('#' + b.dataset.target, drawer); if (t) t.scrollIntoView({ block: 'start', behavior: 'smooth' }); break; }
      case 'find-next': applyFind(1); break;
      case 'find-prev': applyFind(-1); break;
    }
  });
  const saveVerdict = debounce((p, v) => { p.verdict = v; commit({ silent: true }); }, 500);
  drawer.addEventListener('input', e => {
    const d = ui.drawer, t = e.target;
    if (!d) return;
    if (t.dataset.var != null) {
      d.values[t.dataset.var] = t.value;
      autosize(t);
      const pv = $('#dPreview', drawer), p = getItem(d.id);
      if (pv && p) pv.innerHTML = filledHTML(p.body, d.values);
      return;
    }
    if (t.id === 'findInput') { d.find = t.value; applyFind(); return; }
    if (t.id === 'fVerdict') { const p = getItem(d.id); if (p) saveVerdict(p, t.value); autosize(t); return; }
    const map = { fTitle: 'title', fBody: 'body', fNotes: 'notes', fSummary: 'summary', fModel: 'model', fUrl: 'url' };
    if (map[t.id]) {
      d.draft[map[t.id]] = t.value; d.dirty = true;
      if (t.id === 'fBody') updateBodyMeta();
      if (t.tagName === 'TEXTAREA' && t.id !== 'fBody') autosize(t);
    }
  });
  drawer.addEventListener('change', async e => {
    const d = ui.drawer, t = e.target;
    if (!d) return;
    if (t.id === 'fProject') {
      if (t.value === '__new') {
        const name = await promptModal({ title: 'New project', label: 'Name', placeholder: 'e.g. Q3 market scan', confirm: 'Add project' });
        if (!ui.drawer) return;
        if (name) { const c = addNamed('project', name); if (c) { ui.drawer.draft.projectId = c.id; ui.drawer.dirty = true; } }
        const s2 = $('#fProject', drawer);
        if (s2) { s2.innerHTML = opts(state.projects, ui.drawer.draft.projectId, 'No project', '<option value="__new">New project…</option>'); s2.value = ui.drawer.draft.projectId || ''; s2.focus(); }
      } else { d.draft.projectId = t.value || null; d.dirty = true; }
    }
    else if (t.id === 'fPlatform') { d.draft.platform = t.value || null; d.dirty = true; }
    else if (t.id === 'fStatus') { d.draft.status = t.value; d.dirty = true; }
    else if (t.id === 'fPrompt') { d.draft.promptId = t.value || null; d.dirty = true; }
    else if (t.id === 'fRunAt') { d.draft.runAt = fromDateInput(t.value); d.dirty = true; }
  });
  drawer.addEventListener('paste', e => {
    const t = e.target, d = ui.drawer;
    if (!d || t.id !== 'fBody' || d.kind !== 'doc' || !e.clipboardData) return;
    const html = e.clipboardData.getData('text/html');
    if (!html || !looksStructuredHtml(html)) return;
    e.preventDefault();
    const md = htmlToMd(html);
    t.setRangeText(md, t.selectionStart, t.selectionEnd, 'end');
    t.dispatchEvent(new Event('input', { bubbles: true }));
    if (!d.draft.title.trim()) { const ti = $('#fTitle', drawer); if (ti && firstHeading(md)) { ti.value = firstHeading(md); d.draft.title = ti.value; } }
    toast('Converted the pasted rich text to Markdown.');
  });
  drawer.addEventListener('keydown', e => {
    const t = e.target, d = ui.drawer;
    if (!d) return;
    if (t.id === 'findInput') {
      if (e.key === 'Enter') { e.preventDefault(); applyFind(e.shiftKey ? -1 : 1); }
      else if (e.key === 'Escape' && t.value) { e.preventDefault(); e.stopPropagation(); t.value = ''; d.find = ''; applyFind(); }
      return;
    }
    if (t.id !== 'fTagInput') return;
    if ((e.key === 'Enter' || e.key === ',') && t.value.trim()) { e.preventDefault(); addDraftTags(t.value); t.value = ''; }
    else if (e.key === 'Enter') e.preventDefault();
    else if (e.key === 'Backspace' && !t.value && d.draft.tags.length) { d.draft.tags.pop(); d.dirty = true; updateTagBox(); }
  });
  drawer.addEventListener('focusout', e => { if (e.target.id === 'fTagInput' && e.target.value.trim() && ui.drawer) { addDraftTags(e.target.value); e.target.value = ''; } });

  /* Compare */
  let syncing = false;
  cmpEl.addEventListener('click', async e => {
    const c = ui.compare;
    if (!c) return;
    const star = e.target.closest('[data-rate]');
    if (star) {
      const td = star.closest('[data-did]'), d = td && getItem(td.dataset.did), n = +star.dataset.rate;
      if (d) { d.rating = d.rating === n ? 0 : n; commit({ silent: true }); renderList(); star.closest('.stars').outerHTML = starsHTML(d.rating, 'cmp'); }
      return;
    }
    const b = e.target.closest('[data-cact]');
    if (!b) return;
    if (b.dataset.cact === 'close') closeCompare();
    else if (b.dataset.cact === 'open') openItem(b.dataset.did, 'read');
    else if (b.dataset.cact === 'reconcile') {
      const docs = c.ids.map(getItem).filter(Boolean), p = c.promptId ? getItem(c.promptId) : null;
      const text = reconcileText(docs, p);
      const ok = await copyText(text);
      if (!ok) { toast('The clipboard isn’t available here.', { kind: 'warn' }); return; }
      flash(b);
      toast(`Copied a reconcile prompt with ${plural(docs.length, 'report')}${text.length > 150000 ? '. It’s long, so use a model with a large context window' : ''}.`, { timeout: 5000 });
    }
  });
  cmpEl.addEventListener('input', e => {
    const c = ui.compare;
    if (!c) return;
    if (e.target.id === 'cmpFind') { c.find = e.target.value; applyCompareFind(); }
    else if (e.target.id === 'cmpVerdict') { const p = getItem(c.promptId); if (p) saveVerdict(p, e.target.value); }
  });
  cmpEl.addEventListener('change', e => { if (e.target.id === 'cmpSync' && ui.compare) ui.compare.sync = e.target.checked; });
  cmpEl.addEventListener('scroll', e => {
    const c = ui.compare, src = e.target;
    if (!c || !c.sync || syncing || !src.classList || !src.classList.contains('cmp-body')) return;
    const ratio = src.scrollTop / Math.max(1, src.scrollHeight - src.clientHeight);
    syncing = true;
    $$('.cmp-body', cmpEl).forEach(b => { if (b !== src) b.scrollTop = ratio * (b.scrollHeight - b.clientHeight); });
    requestAnimationFrame(() => { syncing = false; });
  }, true);

  /* Global keys */
  document.addEventListener('keydown', e => {
    if (e.defaultPrevented) return;
    const mod = e.metaKey || e.ctrlKey;
    if (!modalWrap.hidden) {
      if (e.key === 'Escape') { e.preventDefault(); closeModal(null); }
      else if (e.key === 'Tab') trapTab(e, modalWrap);
      return;
    }
    if (ui.drawer) {
      if (e.key === 'Escape') { e.preventDefault(); requestCloseDrawer(); }
      else if (e.key === 'Tab') trapTab(e, drawer);
      else if (mod && e.key === 'Enter') { e.preventDefault(); if (ui.drawer.mode === 'use') copyPrompt(null); else if (ui.drawer.mode === 'edit') saveDraft(); }
      else if (mod && (e.key === 's' || e.key === 'S')) { e.preventDefault(); if (ui.drawer.mode === 'edit') saveDraft(); }
      else if (mod && (e.key === 'f' || e.key === 'F') && ui.drawer.mode === 'read') { const f = $('#findInput', drawer); if (f) { e.preventDefault(); f.focus(); f.select(); } }
      return;
    }
    if (ui.compare) {
      if (e.key === 'Escape') { e.preventDefault(); closeCompare(); }
      else if (e.key === 'Tab') trapTab(e, cmpEl);
      return;
    }
    if (mod && (e.key === 'k' || e.key === 'K')) { e.preventDefault(); qInput.focus(); qInput.select(); return; }
    const typing = /^(INPUT|TEXTAREA|SELECT)$/.test(e.target.tagName) || e.target.isContentEditable;
    if (typing) {
      if (e.key === 'Escape' && e.target === qInput) { if (qInput.value) { qInput.value = ''; ui.q = ''; renderList(); } else qInput.blur(); }
      return;
    }
    if (mod && (e.key === 'z' || e.key === 'Z') && !e.shiftKey) { e.preventDefault(); undo(); return; }
    if (mod || e.altKey) return;
    if (e.key === '/') { e.preventDefault(); qInput.focus(); qInput.select(); }
    else if (e.key === 'n' || e.key === 'N') { e.preventDefault(); openNew('prompt'); }
    else if (e.key === 'a' || e.key === 'A') { e.preventDefault(); openNew('doc', { focus: 'fBody' }); }
    else if (e.key === '?') { e.preventDefault(); openShortcuts(); }
    else if (e.key === 'Escape') { if (ui.sidebarOpen) { setSidebar(false); menuBtn.focus(); } else if (ui.selectMode) setSelectMode(false); }
  });

  /* Another tab saved a newer library */
  if (bc) bc.onmessage = async ev => {
    if (!ev.data || !(ev.data.t > state.updatedAt)) return;
    let s = await Store.get('state');
    if (!s) { try { s = JSON.parse(localStorage.getItem(LS_KEY) || 'null'); } catch (e) { s = null; } }
    if (s && +s.updatedAt > state.updatedAt) { state = normalize(s); render(); refreshOpenViews(); }
  };
  document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'hidden') { persist.cancel(); writeNow(); } });
}

/* ================= Start ================= */
async function init() {
  $$('[data-icon]').forEach(el => {
    const svg = icon(el.dataset.icon);
    if (el.tagName === 'SPAN' && !el.children.length && !el.textContent.trim()) el.outerHTML = svg;
    else el.insertAdjacentHTML('afterbegin', svg);
  });
  sortSel.innerHTML = Object.entries(SORTS).map(([k, v]) => `<option value="${k}">${v.label}</option>`).join('');
  groupSel.innerHTML = [['none', 'No groups'], ['platform', 'By platform'], ['project', 'By project'], ['kind', 'By type'], ['status', 'By status']].map(([v, l]) => `<option value="${v}">${l}</option>`).join('');
  state = await loadState();
  bind();
  render();
  writeNow();
  try { if (navigator.storage && navigator.storage.persist) navigator.storage.persist().catch(() => {}); } catch (e) { /* optional */ }
  Sync.init();
}
init();

})();
</script>
</body>
